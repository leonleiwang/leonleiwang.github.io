n  text-align: center;\n  font-size: 13px;\n  font-weight: 600;\n  line-height: 1.4;\n  pointer-events: none;\n}\n\n.skill-list {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  column-gap: 34px;\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.skill-row {\n  --skill-color: var(--skill-agents);\n  position: relative;\n  padding: 13px 0 13px 22px;\n  border-top: 1px solid var(--line);\n}\n\n.skill-row:nth-last-child(-n + 2) { border-bottom: 1px solid var(--line); }\n.skill-row:nth-child(2) { --skill-color: var(--skill-retrieval); }\n.skill-row:nth-child(3) { --skill-color: var(--skill-fullstack); }\n.skill-row:nth-child(4) { --skill-color: var(--skill-evaluation); }\n.skill-row:nth-child(5) { --skill-color: var(--skill-integration); }\n.skill-row:nth-child(6) { --skill-color: var(--skill-serving); }\n.skill-row:nth-child(7) { --skill-color: var(--skill-ml); }\n.skill-row:nth-child(8) { --skill-color: var(--skill-training); }\n\n.skill-row.is-active h2 { color: var(--accent); }\n\n.skill-row::before {\n  position: absolute;\n  top: 19px;\n  left: 0;\n  width: 10px;\n  height: 10px;\n  border-radius: 50%;\n  background: var(--skill-color);\n  content: \"\";\n}\n\n.skill-row h2 {\n  margin: 0 0 4px;\n  font-size: 17px;\n  font-weight: 600;\n}\n\n.content p.skill-tools {\n  margin: 0;\n  color: var(--muted);\n  font-size: 13px;\n  word-break: keep-all;\n}\n\n.skills-learning { margin-top: 20px; }\n\n.skills-learning summary {\n  width: fit-content;\n  padding: 6px 0;\n  color: var(--accent);\n  cursor: pointer;\n  font-size: 14px;\n}\n\n.skills-learning dl {\n  max-width: 64ch;\n  margin: 12px 0 0;\n  padding-left: 16px;\n  border-left: 1px solid var(--line);\n  font-size: 14px;\n  line-height: 1.65;\n}\n\n.skills-learning dt { font-weight: 600; }\n.skills-learning dd { margin: 2px 0 12px; color: var(--body); }\n.skills-learning dd:last-child { margin-bottom: 0; }\n\n@media (max-width: 600px) {\n  .skills-figure { width: min(86%, 330px); }\n  .skill-list { grid-template-columns: 1fr; }\n  .skill-row:nth-last-child(2) { border-bottom: 0; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .skills-slice { transition: none; }\n}\n\n.entries {\n  margin: 32px 0 14px;\n  padding: 0;\n  list-style: none;\n}\n\n.entry {\n  display: grid;\n  grid-template-columns: 28px minmax(0, 1fr);\n  gap: 13px;\n  padding: 22px 0;\n  border-top: 1px solid var(--line);\n}\n\n.entry:last-child { border-bottom: 1px solid var(--line); }\n.entry-number { padding-top: 6px; color: var(--muted); font: 11px var(--mono); }\n.entry h2 { margin: 0 0 7px; font-size: 19px; font-weight: 550; overflow-wrap: anywhere; }\n.entry h2 a { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }\n.entry h2 a:hover { color: var(--accent); }\n.entry h2 a span { color: var(--accent); }\n.content p.entry-description { margin-bottom: 9px; }\n.content p.tags { margin-bottom: 0; font: 11px/1.65 var(--mono); color: var(--muted); }\n\n@media (max-width: 600px) {\n  .site-header { min-height: 68px; padding: 0 20px; }\n  .site-nav { gap: clamp(12px, 4.4vw, 24px); }\n  .site-nav a { font-size: 12px; }\n  .language { gap: 5px; font-size: 11px; }\n  .wordmark { font-size: 15px; }\n  .home-main { padding: 4px 16px 28px; }\n  .nameplate { padding: 72px 32px 60px; }\n  html[lang=\"en\"] .nameplate h1 { font-size: clamp(30px, 10vw, 45px); }\n  .wire-caption { padding: 0 6px; font-size: 8px; }\n  .role { font-size: clamp(12px, 3.5vw, 15px); }\n  .intro { font-size: 13px; }\n  .socials { gap: 23px; margin-top: 29px; }\n  .socials a { font-size: 10px; }\n  .site-footer { padding: 13px 20px 19px; font-size: 10px; }\n  .content { width: calc(100% - 44px); padding: 49px 0 64px; }\n  .entry { grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }\n}\n\n@media (max-width: 355px) {\n  .site-header { padding-inline: 13px; }\n  .site-nav { gap: 8px; }\n  .nameplate { padding-inline: 27px; }\n  .socials { gap: 16px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .social-icon { transition: none; }\n  .role[data-running=\"true\"] .caret { animation: none; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#main\">Skip to content\u003c/a>\n  \u003cheader class=\"site-header\">\n    \u003ca class=\"wordmark\" data-preview-route=\"en-home\" href=\"#en-home\" aria-label=\"Lei Wang home\">LW\u003cspan>.\u003c/span>\u003c/a>\n    \u003cnav class=\"site-nav\" aria-label=\"Main navigation\">\n      \u003ca data-preview-route=\"en-home\" href=\"#en-home\">Home\u003c/a>\n      \u003ca data-preview-route=\"en-about\" href=\"#en-about\">About\u003c/a>\n      \u003ca data-preview-route=\"en-projects\" href=\"#en-projects\">Projects\u003c/a>\n      \u003ca data-preview-route=\"en-skills\" href=\"#en-skills\" aria-current=\"page\">Skills\u003c/a>\n      \u003ca data-preview-route=\"en-focus\" href=\"#en-focus\">Focus\u003c/a>\n    \u003c/nav>\n    \u003cnav class=\"language\" aria-label=\"Language\">\n      \u003cspan aria-current=\"true\">EN\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca data-preview-route=\"zh-skills\" href=\"#zh-skills\" lang=\"zh-CN\" hreflang=\"zh-CN\">中\u003c/a>\n    \u003c/nav>\n  \u003c/header>\n  \u003cmain class=\"content\" id=\"main\" tabindex=\"-1\">\n    \u003cdiv class=\"skills-heading\">\n      \u003ch1>Skills\u003c/h1>\n      \u003cp class=\"lead\">My technical focus across projects and experiments.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"skills-overview\">\n      \u003cfigure class=\"skills-figure\" hidden>\n        \u003csvg class=\"skills-pie\" viewBox=\"0 0 400 400\" role=\"group\" aria-label=\"Skill areas\">\u003c/svg>\n        \u003cdiv class=\"skills-tooltip\" aria-hidden=\"true\" hidden>\u003c/div>\n      \u003c/figure>\n      \u003cul class=\"skill-list\">\n        \u003cli class=\"skill-row\" data-share=\"22\">\n          \u003ch2>Agent engineering &amp; Harness\u003c/h2>\n          \u003cp class=\"skill-tools\">Python · LangChain · LangGraph · Codex Harness · DeepSeek Harness · MCP · Tool calling · Multi-agent workflows\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"17\">\n          \u003ch2>RAG &amp; vector search\u003c/h2>\n          \u003cp class=\"skill-tools\">Embeddings · BM25 hybrid search · Reranking · Source citations · LLM Wiki · GraphRAG · Ontology modeling · Milvus · Weaviate · Chroma · Qdrant\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"14\">\n          \u003ch2>Full-stack systems &amp; data\u003c/h2>\n          \u003cp class=\"skill-tools\">FastAPI · Java / Spring Boot · PostgreSQL · MySQL · SQLite · Redis · React / Next.js · TypeScript / JavaScript · HTML/CSS\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"12\">\n          \u003ch2>Evaluation, observability &amp; data flywheels\u003c/h2>\n          \u003cp class=\"skill-tools\">Arize Phoenix · Langfuse · pytest · Agent and RAG evaluation · Tracing &amp; replay · Feedback loops\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"11\">\n          \u003ch2>Enterprise integrations &amp; delivery\u003c/h2>\n          \u003cp class=\"skill-tools\">DingTalk · Feishu · WeCom · Node.js · SSE / WebSocket · Docker · GitHub Actions · systemd\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"10\">\n          \u003ch2>Local model serving\u003c/h2>\n          \u003cp class=\"skill-tools\">Qwen models · DeepSeek Flash · Strata · SGLang · vLLM · Ollama · llama.cpp / GGUF · OpenAI-compatible APIs\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"8\">\n          \u003ch2>Machine learning &amp; deep learning\u003c/h2>\n          \u003cp class=\"skill-tools\">Decision trees · KNN · K-means · Random forests · scikit-learn · PyTorch · Reinforcement learning fundamentals\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"6\">\n          \u003ch2>Model training &amp; adaptation\u003c/h2>\n          \u003cp class=\"skill-tools\">Exposure to pre-training and post-training · LLaMA-Factory · SFT · LoRA / QLoRA · PEFT · Dataset preparation\u003c/p>\n        \u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003cdetails class=\"skills-learning\">\n      \u003csummary>Next up…\u003c/summary>\n      \u003cdl>\n        \u003cdt>Agent reliability at scale\u003c/dt>\n        \u003cdd>Designing resumable workflows and testing how agents recover from tool failures.\u003c/dd>\n        \u003cdt>Evaluation and research methods\u003c/dt>\n        \u003cdd>Building reproducible benchmarks, running ablations, and analyzing model errors.\u003c/dd>\n        \u003cdt>Inference performance\u003c/dt>\n        \u003cdd>Profiling latency and throughput and measuring how batching and quantization affect output quality.\u003c/dd>\n      \u003c/dl>\n    \u003c/details>\n  \u003c/main>\n  \u003cfooter class=\"site-footer\">\n    \u003cspan>© 2026 Lei Wang\u003c/span>\n    \u003cspan class=\"motto\" lang=\"la\">Scientia ac Labore\u003c/span>\n  \u003c/footer>\n\u003cscript>\n(() => {\n  const figure = document.querySelector(\".skills-figure\");\n  const chart = figure.querySelector(\".skills-pie\");\n  const tooltip = figure.querySelector(\".skills-tooltip\");\n  const rows = Array.from(document.querySelectorAll(\".skill-row\"), (row) => {\n    return {\n      row,\n      color: getComputedStyle(row).getPropertyValue(\"--skill-color\"),\n      share: Number(row.dataset.share),\n    };\n  });\n  const svg = \"http://www.w3.org/2000/svg\";\n  const center = 200;\n  const radius = 188;\n  const fullTurn = Math.PI * 2;\n  const total = rows.reduce((sum, { share }) => sum + share, 0);\n  let angle = -Math.PI / 2;\n\n  const slices = rows.map(({ row, color, share }) => {\n    const name = row.querySelector(\"h2\").textContent;\n    const start = angle;\n    const sweep = share / total * fullTurn;\n    angle += sweep;\n    const midpoint = start + sweep / 2;\n    const directionX = Math.cos(midpoint);\n    const directionY = Math.sin(midpoint);\n    const point = (at) => `${center + radius * Math.cos(at)} ${center + radius * Math.sin(at)}`;\n    const element = document.createElementNS(svg, \"path\");\n    element.setAttribute(\"class\", \"skills-slice\");\n    element.setAttribute(\"d\", `M${center} ${center} L${point(start)} A${radius} ${radius} 0 ${sweep > Math.PI ? 1 : 0} 1 ${point(angle)} Z`);\n    element.setAttribute(\"tabindex\", \"0\");\n    element.setAttribute(\"role\", \"button\");\n    element.setAttribute(\"aria-label\", name);\n    element.style.setProperty(\"--slice-color\", color);\n    element.style.setProperty(\"--slice-x\", `${directionX * 5}px`);\n    element.style.setProperty(\"--slice-y\", `${directionY * 5}px`);\n    chart.append(element);\n    return { row, element, name, tooltipY: 50 + directionY * 24 };\n  });\n\n  let hovered = null;\n  let selected = null;\n\n  function render() {\n    const focused = slices.find((slice) => slice.element.matches(\":focus-visible\"));\n    const active = hovered || focused || selected;\n    for (const slice of slices) {\n      slice.element.classList.toggle(\"is-active\", slice === active);\n      slice.element.setAttribute(\"aria-pressed\", String(slice === selected));\n      slice.row.classList.toggle(\"is-active\", slice === active);\n    }\n    tooltip.hidden = !active;\n    if (active) {\n      tooltip.textContent = active.name;\n      tooltip.style.setProperty(\"--tooltip-y\", `${active.tooltipY}%`);\n    }\n  }\n\n  function select(slice) {\n    selected = selected === slice ? null : slice;\n    render();\n  }\n\n  for (const slice of slices) {\n    const { element } = slice;\n    element.addEventListener(\"pointerenter\", (event) => {\n      if (event.pointerType === \"touch\") return;\n      hovered = slice;\n      render();\n    });\n    element.addEventListener(\"pointerleave\", () => {\n      if (hovered === slice) hovered = null;\n      render();\n    });\n    element.addEventListener(\"focus\", render);\n    element.addEventListener(\"blur\", () => queueMicrotask(render));\n    element.addEventListener(\"click\", () => select(slice));\n    element.addEventListener(\"keydown\", (event) => {\n      if (event.key !== \"Enter\" && event.key !== \" \") return;\n      event.preventDefault();\n      select(slice);\n    });\n  }\n\n  render();\n  figure.hidden = false;\n})();\n\u003c/script>\n\u003cscript>\ndocument.addEventListener(\"click\", (event) => {\n  const link = event.target.closest(\"a[data-preview-route]\");\n  if (!link) return;\n  event.preventDefault();\n  parent.postMessage({ type: \"lei-wang-preview-route\", route: link.dataset.previewRoute }, \"*\");\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n\n","zh-skills":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"王磊在 AI Agent、后端、网页界面、系统集成与工程交付中的技术栈。\">\n  \u003cmeta property=\"og:type\" content=\"website\">\n  \u003cmeta property=\"og:title\" content=\"技能 · 王磊\">\n  \u003cmeta property=\"og:description\" content=\"王磊在 AI Agent、后端、网页界面、系统集成与工程交付中的技术栈。\">\n  \u003ctitle>技能 · 王磊\u003c/title>\n  \u003cbase href=\"about:srcdoc\">\n  \u003cstyle>\n:root {\n  color-scheme: light;\n  --paper: #fcfbf8;\n  --ink: #293b47;\n  --body: #575f64;\n  --muted: #677176;\n  --accent: #376772;\n  --line: #e1e3dd;\n  --wire: #c5cfca;\n  --mono: ui-monospace, SFMono-Regular, Consolas, monospace;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  display: flex;\n  flex-direction: column;\n  min-height: 100vh;\n  min-height: 100svh;\n  margin: 0;\n  color: var(--ink);\n  background: var(--paper);\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n}\n\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; }\na:focus-visible, button:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 5px;\n}\n\n.visually-hidden,\n.skip-link:not(:focus) {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  overflow: hidden;\n  clip-path: inset(50%);\n  white-space: nowrap;\n}\n\n.skip-link:focus {\n  position: absolute;\n  z-index: 2;\n  top: 12px;\n  left: 12px;\n  padding: 12px;\n  background: var(--paper);\n}\n\n.site-header {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  min-height: 84px;\n  padding: 0 5.5%;\n}\n\n.wordmark {\n  justify-self: start;\n  padding: 10px 0;\n  font-size: 17px;\n  font-weight: 700;\n  letter-spacing: -.04em;\n}\n\n.wordmark span { color: var(--accent); }\n\n.site-nav,\n.language {\n  display: flex;\n  align-items: center;\n}\n\n.site-nav { gap: 36px; }\n.site-nav a {\n  position: relative;\n  padding: 14px 0;\n  color: var(--body);\n  font-size: 14px;\n}\n\n.site-nav a:hover,\n.site-nav [aria-current=\"page\"] { color: var(--ink); }\n\n.site-nav [aria-current=\"page\"]::after {\n  position: absolute;\n  bottom: 5px;\n  left: calc(50% - 2px);\n  width: 4px;\n  height: 4px;\n  border-radius: 50%;\n  background: var(--accent);\n  content: \"\";\n}\n\n.language {\n  justify-self: end;\n  gap: 8px;\n  font-size: 12px;\n  color: var(--muted);\n}\n\n.language a { padding: 12px 0; }\n.language [aria-current=\"true\"] { color: var(--ink); font-weight: 600; }\n.language a:hover { color: var(--accent); }\n\nmain { flex: 1; }\n\n.home-main {\n  display: grid;\n  place-items: center;\n  padding: 14px 24px 40px;\n}\n\n.nameplate {\n  position: relative;\n  width: min(100%, 660px);\n  padding: 82px 56px 66px;\n  text-align: center;\n}\n\n.wire {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  color: var(--wire);\n  pointer-events: none;\n}\n\n.wire > path {\n  stroke: currentColor;\n  stroke-width: 1;\n  stroke-dasharray: 4 7;\n  vector-effect: non-scaling-stroke;\n}\n\n.wire-caption {\n  position: absolute;\n  top: 8.65%;\n  left: 8.9%;\n  padding: 0 9px;\n  transform: translateY(-50%);\n  background: var(--paper);\n  color: var(--muted);\n  font: 10px var(--mono);\n  letter-spacing: .11em;\n  text-transform: uppercase;\n}\n\n.nameplate h1 {\n  margin: 0;\n  font: 400 clamp(45px, 6.4vw, 66px)/1.05 Georgia, \"Times New Roman\", serif;\n  letter-spacing: -.045em;\n}\n\nhtml[lang=\"en\"] .nameplate h1 { font-size: clamp(45px, 6.4vw, 50px); }\n\n.role {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 4px;\n  min-height: 44px;\n  margin-top: 17px;\n  color: var(--accent);\n  font: 16px/1.4 var(--mono);\n}\n\n.role-display { display: inline-flex; align-items: center; }\n\n.role-toggle {\n  display: grid;\n  flex: none;\n  place-items: center;\n  width: 32px;\n  height: 44px;\n  padding: 0;\n  border: 0;\n  border-radius: 4px;\n  color: var(--muted);\n  background: transparent;\n  cursor: pointer;\n}\n\n.role-toggle:hover { color: var(--accent); }\n.role-toggle[hidden], .play-icon, .role[data-paused=\"true\"] .pause-icon { display: none; }\n.role[data-paused=\"true\"] .play-icon { display: block; }\n\n.caret {\n  display: inline-block;\n  flex: none;\n  width: 1px;\n  height: 1.1em;\n  margin-left: 3px;\n  background: currentColor;\n  opacity: 0;\n}\n\n.role[data-running=\"true\"] .caret { animation: blink 1s step-end infinite; }\n@keyframes blink { 0%, 49% { opacity: 1; } }\n\n.intro {\n  max-width: 390px;\n  margin: 15px auto 0;\n  color: var(--body);\n  font-size: 14px;\n  line-height: 1.85;\n  text-wrap: pretty;\n}\n\n.intro span { display: block; }\n\n.socials {\n  display: flex;\n  justify-content: center;\n  gap: 33px;\n  margin: 37px 0 0;\n  padding: 0;\n  list-style: none;\n}\n\n.socials a {\n  display: grid;\n  justify-items: center;\n  gap: 9px;\n  color: var(--muted);\n  font: 11px var(--mono);\n}\n\n.social-icon {\n  display: grid;\n  place-items: center;\n  width: 46px;\n  height: 46px;\n  border: 1px solid var(--line);\n  border-radius: 50%;\n  color: var(--ink);\n  transition: color .18s, border-color .18s, transform .18s;\n}\n\n.socials a:hover .social-icon,\n.socials a:focus-visible .social-icon {\n  border-color: var(--accent);\n  color: var(--accent);\n  transform: translateY(-2px);\n}\n\n.social-icon svg { width: 20px; height: 20px; }\n.icon-cutout { fill: var(--paper); }\n\n.site-footer {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  gap: 10px;\n  padding: 17px 5.5% 23px;\n  color: var(--muted);\n  font-size: 11px;\n}\n\n.home-footer {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  padding-top: 4px;\n}\n\n.home-footer .motto { grid-column: 3; justify-self: end; }\n\n.versions-link {\n  display: block;\n  width: fit-content;\n  margin-top: 3px;\n  color: var(--accent);\n  text-decoration: underline;\n  text-underline-offset: .18em;\n}\n\n.game-launch,\n.inline-game button {\n  border: 0;\n  border-radius: 4px;\n  color: var(--muted);\n  background: transparent;\n  font: inherit;\n  cursor: pointer;\n}\n\n.game-launch {\n  display: grid;\n  place-items: center;\n  width: 44px;\n  height: 40px;\n  padding: 0;\n  touch-action: none;\n  user-select: none;\n}\n\n.game-launch:hover,\n.inline-game button:hover { color: var(--accent); }\n\n.game-launch[hidden],\n.inline-game[hidden] { display: none; }\n\n.game-active .game-launch,\n.entrance-active .game-launch,\n.entrance-pending .site-header,\n.entrance-pending .nameplate,\n.entrance-pending .home-footer { visibility: hidden; }\n\n.entrance-ball {\n  position: fixed;\n  z-index: 2;\n  top: -5px;\n  left: -5px;\n  width: 10px;\n  height: 10px;\n  border-radius: 50%;\n  background: var(--accent);\n  pointer-events: none;\n}\n\n.inline-game {\n  position: fixed;\n  z-index: 3;\n  inset: 0;\n  pointer-events: none;\n}\n\n.inline-game-canvas {\n  display: block;\n  width: 100%;\n  height: 100%;\n  outline: none;\n  pointer-events: auto;\n  touch-action: none;\n}\n\n.inline-game-hud {\n  position: absolute;\n  top: 10px;\n  right: 12px;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  color: var(--muted);\n  font: 11px var(--mono);\n}\n\n.inline-game button { pointer-events: auto; }\n\n.inline-game .inline-game-exit {\n  width: 32px;\n  height: 36px;\n  font-size: 21px;\n}\n\n.content {\n  width: min(780px, calc(100% - 56px));\n  margin: 0 auto;\n  padding: 72px 0 88px;\n}\n\n.eyebrow {\n  margin: 0 0 16px;\n  color: var(--muted);\n  font: 11px/1.5 var(--mono);\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.content h1 {\n  margin: 0 0 24px;\n  font: 400 clamp(35px, 5.2vw, 53px)/1.12 Georgia, \"Times New Roman\", \"Songti SC\", serif;\n  letter-spacing: -.033em;\n  text-wrap: balance;\n}\n\n.content p:not(.eyebrow) {\n  max-width: 64ch;\n  margin: 0 0 16px;\n  color: var(--body);\n  font-size: 15px;\n  line-height: 1.85;\n}\n\n.content p.lead { font-size: 17px; }\n\n.content-link {\n  display: inline-block;\n  margin-top: 14px;\n  padding-block: 6px;\n  color: var(--accent);\n  font-size: 14px;\n  text-decoration: underline;\n  text-underline-offset: 4px;\n}\n\n.skills-heading { text-align: center; }\n.content .skills-heading p.lead { margin-inline: auto; }\n\n.skills-overview {\n  --skill-agents: #86d0f4;\n  --skill-retrieval: #0abab5;\n  --skill-fullstack: #79cf4e;\n  --skill-evaluation: #f4d94e;\n  --skill-integration: #ff9638;\n  --skill-serving: #d7d9dc;\n  --skill-ml: #a789e8;\n  --skill-training: #4f6d9f;\n  margin: 34px 0 12px;\n}\n\n.skills-figure {\n  position: relative;\n  width: min(100%, 395px);\n  margin: 0 auto 35px;\n}\n\n.skills-pie {\n  display: block;\n  width: 100%;\n  height: auto;\n}\n\n.skills-slice {\n  fill: var(--slice-color);\n  stroke: color-mix(in srgb, var(--slice-color) 82%, var(--ink));\n  stroke-width: 1.4;\n  stroke-linejoin: round;\n  cursor: pointer;\n  transform-box: view-box;\n  transform-origin: center;\n  transition: transform 160ms ease-out, filter 160ms ease-out;\n}\n\n.skills-slice.is-active {\n  filter: brightness(1.10) saturate(1.22);\n  transform: translate(var(--slice-x), var(--slice-y)) scale(1.025);\n}\n\n.skills-slice:focus-visible {\n  outline: none;\n  stroke: var(--ink);\n  stroke-width: 2.5;\n}\n\n.skills-tooltip {\n  position: absolute;\n  top: var(--tooltip-y, 50%);\n  left: 50%;\n  width: max-content;\n  max-width: 80%;\n  padding: 9px 13px;\n  transform: translate(-50%, -50%);\n  border-radius: 5px;\n  background: var(--ink);\n  color: var(--paper);\n  text-align: center;\n  font-size: 13px;\n  font-weight: 600;\n  line-height: 1.4;\n  pointer-events: none;\n}\n\n.skill-list {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  column-gap: 34px;\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.skill-row {\n  --skill-color: var(--skill-agents);\n  position: relative;\n  padding: 13px 0 13px 22px;\n  border-top: 1px solid var(--line);\n}\n\n.skill-row:nth-last-child(-n + 2) { border-bottom: 1px solid var(--line); }\n.skill-row:nth-child(2) { --skill-color: var(--skill-retrieval); }\n.skill-row:nth-child(3) { --skill-color: var(--skill-fullstack); }\n.skill-row:nth-child(4) { --skill-color: var(--skill-evaluation); }\n.skill-row:nth-child(5) { --skill-color: var(--skill-integration); }\n.skill-row:nth-child(6) { --skill-color: var(--skill-serving); }\n.skill-row:nth-child(7) { --skill-color: var(--skill-ml); }\n.skill-row:nth-child(8) { --skill-color: var(--skill-training); }\n\n.skill-row.is-active h2 { color: var(--accent); }\n\n.skill-row::before {\n  position: absolute;\n  top: 19px;\n  left: 0;\n  width: 10px;\n  height: 10px;\n  border-radius: 50%;\n  background: var(--skill-color);\n  content: \"\";\n}\n\n.skill-row h2 {\n  margin: 0 0 4px;\n  font-size: 17px;\n  font-weight: 600;\n}\n\n.content p.skill-tools {\n  margin: 0;\n  color: var(--muted);\n  font-size: 13px;\n  word-break: keep-all;\n}\n\n.skills-learning { margin-top: 20px; }\n\n.skills-learning summary {\n  width: fit-content;\n  padding: 6px 0;\n  color: var(--accent);\n  cursor: pointer;\n  font-size: 14px;\n}\n\n.skills-learning dl {\n  max-width: 64ch;\n  margin: 12px 0 0;\n  padding-left: 16px;\n  border-left: 1px solid var(--line);\n  font-size: 14px;\n  line-height: 1.65;\n}\n\n.skills-learning dt { font-weight: 600; }\n.skills-learning dd { margin: 2px 0 12px; color: var(--body); }\n.skills-learning dd:last-child { margin-bottom: 0; }\n\n@media (max-width: 600px) {\n  .skills-figure { width: min(86%, 330px); }\n  .skill-list { grid-template-columns: 1fr; }\n  .skill-row:nth-last-child(2) { border-bottom: 0; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .skills-slice { transition: none; }\n}\n\n.entries {\n  margin: 32px 0 14px;\n  padding: 0;\n  list-style: none;\n}\n\n.entry {\n  display: grid;\n  grid-template-columns: 28px minmax(0, 1fr);\n  gap: 13px;\n  padding: 22px 0;\n  border-top: 1px solid var(--line);\n}\n\n.entry:last-child { border-bottom: 1px solid var(--line); }\n.entry-number { padding-top: 6px; color: var(--muted); font: 11px var(--mono); }\n.entry h2 { margin: 0 0 7px; font-size: 19px; font-weight: 550; overflow-wrap: anywhere; }\n.entry h2 a { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }\n.entry h2 a:hover { color: var(--accent); }\n.entry h2 a span { color: var(--accent); }\n.content p.entry-description { margin-bottom: 9px; }\n.content p.tags { margin-bottom: 0; font: 11px/1.65 var(--mono); color: var(--muted); }\n\n@media (max-width: 600px) {\n  .site-header { min-height: 68px; padding: 0 20px; }\n  .site-nav { gap: clamp(12px, 4.4vw, 24px); }\n  .site-nav a { font-size: 12px; }\n  .language { gap: 5px; font-size: 11px; }\n  .wordmark { font-size: 15px; }\n  .home-main { padding: 4px 16px 28px; }\n  .nameplate { padding: 72px 32px 60px; }\n  html[lang=\"en\"] .nameplate h1 { font-size: clamp(30px, 10vw, 45px); }\n  .wire-caption { padding: 0 6px; font-size: 8px; }\n  .role { font-size: clamp(12px, 3.5vw, 15px); }\n  .intro { font-size: 13px; }\n  .socials { gap: 23px; margin-top: 29px; }\n  .socials a { font-size: 10px; }\n  .site-footer { padding: 13px 20px 19px; font-size: 10px; }\n  .content { width: calc(100% - 44px); padding: 49px 0 64px; }\n  .entry { grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }\n}\n\n@media (max-width: 355px) {\n  .site-header { padding-inline: 13px; }\n  .site-nav { gap: 8px; }\n  .nameplate { padding-inline: 27px; }\n  .socials { gap: 16px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .social-icon { transition: none; }\n  .role[data-running=\"true\"] .caret { animation: none; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#main\">跳到正文\u003c/a>\n  \u003cheader class=\"site-header\">\n    \u003ca class=\"wordmark\" data-preview-route=\"zh-home\" href=\"#zh-home\" aria-label=\"王磊的首页\">LW\u003cspan>.\u003c/span>\u003c/a>\n    \u003cnav class=\"site-nav\" aria-label=\"主导航\">\n      \u003ca data-preview-route=\"zh-home\" href=\"#zh-home\">首页\u003c/a>\n      \u003ca data-preview-route=\"zh-about\" href=\"#zh-about\">关于\u003c/a>\n      \u003ca data-preview-route=\"zh-projects\" href=\"#zh-projects\">项目\u003c/a>\n      \u003ca data-preview-route=\"zh-skills\" href=\"#zh-skills\" aria-current=\"page\">技能\u003c/a>\n      \u003ca data-preview-route=\"zh-focus\" href=\"#zh-focus\">探索\u003c/a>\n    \u003c/nav>\n    \u003cnav class=\"language\" aria-label=\"语言\">\n      \u003ca data-preview-route=\"en-skills\" href=\"#en-skills\" lang=\"en\" hreflang=\"en\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan aria-current=\"true\">中\u003c/span>\n    \u003c/nav>\n  \u003c/header>\n  \u003cmain class=\"content\" id=\"main\" tabindex=\"-1\">\n    \u003cdiv class=\"skills-heading\">\n      \u003ch1>技能\u003c/h1>\n      \u003cp class=\"lead\">我在工程项目和实验中的技术侧重。\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"skills-overview\">\n      \u003cfigure class=\"skills-figure\" hidden>\n        \u003csvg class=\"skills-pie\" viewBox=\"0 0 400 400\" role=\"group\" aria-label=\"技能方向\">\u003c/svg>\n        \u003cdiv class=\"skills-tooltip\" aria-hidden=\"true\" hidden>\u003c/div>\n      \u003c/figure>\n      \u003cul class=\"skill-list\">\n        \u003cli class=\"skill-row\" data-share=\"22\">\n          \u003ch2>Agent 工程与 Harness\u003c/h2>\n          \u003cp class=\"skill-tools\">Python · LangChain · LangGraph · Codex Harness · DeepSeek Harness · MCP · 工具调用 · 多 Agent 协作\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"17\">\n          \u003ch2>RAG 与向量检索\u003c/h2>\n          \u003cp class=\"skill-tools\">向量嵌入 · BM25 混合检索 · 重排序 · 来源引用 · LLM Wiki · GraphRAG · Ontology（本体建模） · Milvus · Weaviate · Chroma · Qdrant\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"14\">\n          \u003ch2>全栈与数据系统\u003c/h2>\n          \u003cp class=\"skill-tools\">FastAPI · Java / Spring Boot · PostgreSQL · MySQL · SQLite · Redis · React / Next.js · TypeScript / JavaScript · HTML/CSS\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"12\">\n          \u003ch2>评测、可观测性与数据飞轮\u003c/h2>\n          \u003cp class=\"skill-tools\">Arize Phoenix · Langfuse · pytest · Agent 与 RAG 评测 · 链路追踪与回放 · 反馈闭环\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"11\">\n          \u003ch2>企业集成与交付\u003c/h2>\n          \u003cp class=\"skill-tools\">钉钉 · 飞书 · 企业微信 · Node.js · SSE / WebSocket · Docker · GitHub Actions · systemd\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"10\">\n          \u003ch2>本地模型部署\u003c/h2>\n          \u003cp class=\"skill-tools\">Qwen 系列模型 · DeepSeek Flash · Strata · SGLang · vLLM · Ollama · llama.cpp / GGUF · OpenAI 兼容接口\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"8\">\n          \u003ch2>机器学习与深度学习\u003c/h2>\n          \u003cp class=\"skill-tools\">决策树 · KNN · K-means · 随机森林 · scikit-learn · PyTorch · 强化学习基础\u003c/p>\n        \u003c/li>\n        \u003cli class=\"skill-row\" data-share=\"6\">\n          \u003ch2>模型训练与微调\u003c/h2>\n          \u003cp class=\"skill-tools\">涉及预训练与后训练 · LLaMA-Factory · SFT · LoRA / QLoRA · PEFT · 数据集准备\u003c/p>\n        \u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003cdetails class=\"skills-learning\">\n      \u003csummary>接下来…\u003c/summary>\n      \u003cdl>\n        \u003cdt>规模化 Agent 的可靠性\u003c/dt>\n        \u003cdd>设计可恢复的工作流，测试工具失败时 Agent 能否继续完成任务。\u003c/dd>\n        \u003cdt>评测与研究方法\u003c/dt>\n        \u003cdd>构建可复现的基准，做消融实验和模型错误分析。\u003c/dd>\n        \u003cdt>推理性能\u003c/dt>\n        \u003cdd>分析延迟与吞吐量，衡量批处理和量化对输出质量的影响。\u003c/dd>\n      \u003c/dl>\n    \u003c/details>\n  \u003c/main>\n  \u003cfooter class=\"site-footer\">\n    \u003cspan>© 2026 Lei Wang\u003c/span>\n    \u003cspan class=\"motto\" lang=\"la\">Scientia ac Labore\u003c/span>\n  \u003c/footer>\n\u003cscript>\n(() => {\n  const figure = document.querySelector(\".skills-figure\");\n  const chart = figure.querySelector(\".skills-pie\");\n  const tooltip = figure.querySelector(\".skills-tooltip\");\n  const rows = Array.from(document.querySelectorAll(\".skill-row\"), (row) => {\n    return {\n      row,\n      color: getComputedStyle(row).getPropertyValue(\"--skill-color\"),\n      share: Number(row.dataset.share),\n    };\n  });\n  const svg = \"http://www.w3.org/2000/svg\";\n  const center = 200;\n  const radius = 188;\n  const fullTurn = Math.PI * 2;\n  const total = rows.reduce((sum, { share }) => sum + share, 0);\n  let angle = -Math.PI / 2;\n\n  const slices = rows.map(({ row, color, share }) => {\n    const name = row.querySelector(\"h2\").textContent;\n    const start = angle;\n    const sweep = share / total * fullTurn;\n    angle += sweep;\n    const midpoint = start + sweep / 2;\n    const directionX = Math.cos(midpoint);\n    const directionY = Math.sin(midpoint);\n    const point = (at) => `${center + radius * Math.cos(at)} ${center + radius * Math.sin(at)}`;\n    const element = document.createElementNS(svg, \"path\");\n    element.setAttribute(\"class\", \"skills-slice\");\n    element.setAttribute(\"d\", `M${center} ${center} L${point(start)} A${radius} ${radius} 0 ${sweep > Math.PI ? 1 : 0} 1 ${point(angle)} Z`);\n    element.setAttribute(\"tabindex\", \"0\");\n    element.setAttribute(\"role\", \"button\");\n    element.setAttribute(\"aria-label\", name);\n    element.style.setProperty(\"--slice-color\", color);\n    element.style.setProperty(\"--slice-x\", `${directionX * 5}px`);\n    element.style.setProperty(\"--slice-y\", `${directionY * 5}px`);\n    chart.append(element);\n    return { row, element, name, tooltipY: 50 + directionY * 24 };\n  });\n\n  let hovered = null;\n  let selected = null;\n\n  function render() {\n    const focused = slices.find((slice) => slice.element.matches(\":focus-visible\"));\n    const active = hovered || focused || selected;\n    for (const slice of slices) {\n      slice.element.classList.toggle(\"is-active\", slice === active);\n      slice.element.setAttribute(\"aria-pressed\", String(slice === selected));\n      slice.row.classList.toggle(\"is-active\", slice === active);\n    }\n    tooltip.hidden = !active;\n    if (active) {\n      tooltip.textContent = active.name;\n      tooltip.style.setProperty(\"--tooltip-y\", `${active.tooltipY}%`);\n    }\n  }\n\n  function select(slice) {\n    selected = selected === slice ? null : slice;\n    render();\n  }\n\n  for (const slice of slices) {\n    const { element } = slice;\n    element.addEventListener(\"pointerenter\", (event) => {\n      if (event.pointerType === \"touch\") return;\n      hovered = slice;\n      render();\n    });\n    element.addEventListener(\"pointerleave\", () => {\n      if (hovered === slice) hovered = null;\n      render();\n    });\n    element.addEventListener(\"focus\", render);\n    element.addEventListener(\"blur\", () => queueMicrotask(render));\n    element.addEventListener(\"click\", () => select(slice));\n    element.addEventListener(\"keydown\", (event) => {\n      if (event.key !== \"Enter\" && event.key !== \" \") return;\n      event.preventDefault();\n      select(slice);\n    });\n  }\n\n  render();\n  figure.hidden = false;\n})();\n\u003c/script>\n\u003cscript>\ndocument.addEventListener(\"click\", (event) => {\n  const link = event.target.closest(\"a[data-preview-route]\");\n  if (!link) return;\n  event.preventDefault();\n  parent.postMessage({ type: \"lei-wang-preview-route\", route: link.dataset.previewRoute }, \"*\");\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n\n"};

const page = document.querySelector("iframe");
function show() {
  const route = location.hash.slice(1);
  page.srcdoc = Object.hasOwn(pages, route) ? pages[route] : pages["en-home"];
}
window.addEventListener("hashchange", show);
window.addEventListener("message", (event) => {
  if (event.source !== page.contentWindow || event.data?.type !== "lei-wang-preview-route") return;
  const route = event.data.route;
  if (!Object.hasOwn(pages, route)) return;
  if (location.hash.slice(1) === route) show();
  else location.hash = route;
});
show();
