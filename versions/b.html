const pages = {"en-home":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Lei Wang builds AI agents and full-stack applications. Explore selected projects in retrieval, conversational commerce, customer support, and agent tooling.\">\n  \u003cmeta property=\"og:type\" content=\"website\">\n  \u003cmeta property=\"og:title\" content=\"Lei Wang · AI Agents &amp; Full-Stack Engineering\">\n  \u003cmeta property=\"og:description\" content=\"Lei Wang builds AI agents and full-stack applications. Explore selected projects in retrieval, conversational commerce, customer support, and agent tooling.\">\n  \u003ctitle>Lei Wang · AI Agents &amp; Full-Stack Engineering\u003c/title>\n  \u003cbase href=\"about:srcdoc\">\n  \u003cstyle>\n:root {\n  color-scheme: light;\n  --paper: #fcfbf8;\n  --ink: #293b47;\n  --body: #575f64;\n  --muted: #677176;\n  --accent: #376772;\n  --line: #e1e3dd;\n  --wire: #c5cfca;\n  --mono: ui-monospace, SFMono-Regular, Consolas, monospace;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  display: flex;\n  flex-direction: column;\n  min-height: 100vh;\n  min-height: 100svh;\n  margin: 0;\n  color: var(--ink);\n  background: var(--paper);\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n}\n\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; }\na:focus-visible, button:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 5px;\n}\n\n.visually-hidden,\n.skip-link:not(:focus) {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  overflow: hidden;\n  clip-path: inset(50%);\n  white-space: nowrap;\n}\n\n.skip-link:focus {\n  position: absolute;\n  z-index: 2;\n  top: 12px;\n  left: 12px;\n  padding: 12px;\n  background: var(--paper);\n}\n\n.site-header {\n  display: grid;\n  grid-tem t-size: 11px;\n}\n\n.home-footer {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  padding-top: 4px;\n}\n\n.home-footer .motto { grid-column: 3; justify-self: end; }\n\n.versions-link {\n  display: block;\n  width: fit-content;\n  margin-top: 3px;\n  color: var(--accent);\n  text-decoration: underline;\n  text-underline-offset: .18em;\n}\n\n.game-launch,\n.inline-game button {\n  border: 0;\n  border-radius: 4px;\n  color: var(--muted);\n  background: transparent;\n  font: inherit;\n  cursor: pointer;\n}\n\n.game-launch {\n  display: grid;\n  place-items: center;\n  width: 44px;\n  height: 40px;\n  padding: 0;\n  touch-action: none;\n  user-select: none;\n}\n\n.game-launch:hover,\n.inline-game button:hover { color: var(--accent); }\n\n.game-launch[hidden],\n.inline-game[hidden] { display: none; }\n\n.game-active .game-launch,\n.entrance-active .game-launch,\n.entrance-pending .site-header,\n.entrance-pending .nameplate,\n.entrance-pending .home-footer { visibility: hidden; }\n\n.entrance-ball {\n  position: fixed;\n  z-index: 2;\n  top: -5px;\n  left: -5px;\n  width: 10px;\n  height: 10px;\n  border-radius: 50%;\n  background: var(--accent);\n  pointer-events: none;\n}\n\n.inline-game {\n  position: fixed;\n  z-index: 3;\n  inset: 0;\n  pointer-events: none;\n}\n\n.inline-game-canvas {\n  display: block;\n  width: 100%;\n  height: 100%;\n  outline: none;\n  pointer-events: auto;\n  touch-action: none;\n}\n\n.inline-game-hud {\n  position: absolute;\n  top: 10px;\n  right: 12px;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  color: var(--muted);\n  font: 11px var(--mono);\n}\n\n.inline-game button { pointer-events: auto; }\n\n.inline-game .inline-game-exit {\n  width: 32px;\n  height: 36px;\n  font-size: 21px;\n}\n\n.content {\n  width: min(780px, calc(100% - 56px));\n  margin: 0 auto;\n  padding: 72px 0 88px;\n}\n\n.eyebrow {\n  margin: 0 0 16px;\n  color: var(--muted);\n  font: 11px/1.5 var(--mono);\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.content h1 {\n  margin: 0 0 24px;\n  font: 400 clamp(35px, 5.2vw, 53px)/1.12 Georgia, \"Times New Roman\", \"Songti SC\", serif;\n  letter-spacing: -.033em;\n  text-wrap: balance;\n}\n\n.content p:not(.eyebrow) {\n  max-width: 64ch;\n  margin: 0 0 16px;\n  color: var(--body);\n  font-size: 15px;\n  line-height: 1.85;\n}\n\n.content p.lead { font-size: 17px; }\n\n.content-link {\n  display: inline-block;\n  margin-top: 14px;\n  padding-block: 6px;\n  color: var(--accent);\n  font-size: 14px;\n  text-decoration: underline;\n  text-underline-offset: 4px;\n}\n\n.entries {\n  margin: 32px 0 14px;\n  padding: 0;\n  list-style: none;\n}\n\n.entry {\n  display: grid;\n  grid-template-columns: 28px minmax(0, 1fr);\n  gap: 13px;\n  padding: 22px 0;\n  border-top: 1px solid var(--line);\n}\n\n.entry:last-child { border-bottom: 1px solid var(--line); }\n.entry-number { padding-top: 6px; color: var(--muted); font: 11px var(--mono); }\n.entry h2 { margin: 0 0 7px; font-size: 19px; font-weight: 550; overflow-wrap: anywhere; }\n.entry h2 a { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }\n.entry h2 a:hover { color: var(--accent); }\n.entry h2 a span { color: var(--accent); }\n.content p.entry-description { margin-bottom: 9px; }\n.content p.tags { margin-bottom: 0; font: 11px/1.65 var(--mono); color: var(--muted); }\n\n@media (max-width: 600px) {\n  .site-header { min-height: 68px; padding: 0 20px; }\n  .site-nav { gap: clamp(12px, 4.4vw, 24px); }\n  .site-nav a { font-size: 12px; }\n  .language { gap: 5px; font-size: 11px; }\n  .wordmark { font-size: 15px; }\n  .home-main { padding: 4px 16px 28px; }\n  .nameplate { padding: 72px 32px 60px; }\n  html[lang=\"en\"] .nameplate h1 { font-size: clamp(30px, 10vw, 45px); }\n  .wire-caption { padding: 0 6px; font-size: 8px; }\n  .role { font-size: clamp(12px, 3.5vw, 15px); }\n  .intro { font-size: 13px; }\n  .socials { gap: 23px; margin-top: 29px; }\n  .socials a { font-size: 10px; }\n  .site-footer { padding: 13px 20px 19px; font-size: 10px; }\n  .content { width: calc(100% - 44px); padding: 49px 0 64px; }\n  .entry { grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }\n}\n\n@media (max-width: 355px) {\n  .site-header { padding-inline: 13px; }\n  .site-nav { gap: 8px; }\n  .nameplate { padding-inline: 27px; }\n  .socials { gap: 16px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .social-icon { transition: none; }\n  .role[data-running=\"true\"] .caret { animation: none; }\n}\n\n\u003c/style>\n  \u003cscript>\n(() => {\n  const root = document.documentElement;\n  const motion = matchMedia(\"(prefers-reduced-motion: reduce)\");\n  if (motion.matches || !CSS.supports(\"clip-path\", 'path(\"M0 0H1V1Z\")')) return;\n\n  const svgNamespace = \"http://www.w3.org/2000/svg\";\n  const ripple = true;\n  const outlineDuration = 1050;\n  const revealDuration = ripple ? 700 : 850;\n  const waveDuration = ripple ? 560 : 0;\n  let frameId;\n  let cleanUp = () => {};\n\n  root.classList.add(\"entrance-pending\");\n  const fallback = setTimeout(finish, 4000);\n  document.addEventListener(\"keydown\", finish);\n  window.addEventListener(\"resize\", finish);\n  motion.addEventListener(\"change\", finish);\n\n  function finish() {\n    if (!root.matches(\".entrance-pending, .entrance-active\")) return;\n    clearTimeout(fallback);\n    cancelAnimationFrame(frameId);\n    cleanUp();\n    root.classList.remove(\"entrance-pending\", \"entrance-active\");\n    document.removeEventListener(\"keydown\", finish);\n    window.removeEventListener(\"resize\", finish);\n    motion.removeEventListener(\"change\", finish);\n    document.dispatchEvent(new Event(\"siteentranceend\"));\n  }\n\n  function readingOrder(tiles) {\n    const rows = [];\n    for (const tile of tiles.sort((a, b) => a.y - b.y)) {\n      const row = rows.at(-1);\n      if (!row || tile.y - row[0].y > 8) rows.push([tile]);\n      else row.push(tile);\n    }\n    return rows.flatMap((row) => row.sort((a, b) => a.x - b.x));\n  }\n\n  function collectTiles(elements) {\n    const tiles = [];\n    const range = document.createRange();\n    for (const element of elements) {\n      const box = element.getBoundingClientRect();\n      if (!box.width || !box.height) continue;\n      const group = { element, paths: [], remaining: 0 };\n      const addTile = (rect) => {\n        if (!rect.width || !rect.height) return;\n        const x = rect.left - box.left;\n        const y = rect.top - box.top - 1;\n        const height = rect.height + 2;\n        tiles.push({\n          group,\n          x: rect.left,\n          y: rect.top + rect.height / 2,\n          path: `M${x} ${y}h${rect.width}v${height}h${-rect.width}Z`,\n        });\n        group.remaining++;\n      };\n\n      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);\n      for (let node = walker.nextNode(); node; node = walker.nextNode()) {\n        let offset = 0;\n        for (const character of node.data) {\n          const start = offset;\n          offset += character.length;\n          if (!character.trim()) continue;\n          range.setStart(node, start);\n          range.setEnd(node, offset);\n          addTile(range.getBoundingClientRect());\n        }\n      }\n      if (!group.remaining) addTile(box);\n      element.style.clipPath = \"inset(0 100% 0 0)\";\n    }\n    return readingOrder(tiles);\n  }\n\n  function start() {\n    if (!root.classList.contains(\"entrance-pending\")) return;\n    const wire = document.querySelector(\".wire\");\n    const paths = Array.from(wire.children).filter((element) => element.matches(\"path\"));\n    const launchDot = document.querySelector(\"[data-game-launch] circle\");\n    const inner = \".wire-caption, .nameplate h1, .role-display, .role-toggle, .intro span, .socials a > span\";\n    const outer = \".wordmark, .site-nav a, .language > *, .home-footer > span\";\n    const elements = document.querySelectorAll(ripple ? inner : `${inner}, ${outer}`);\n    const bands = ripple ? Array.from(document.querySelectorAll(\".site-header, .home-footer\"), (element) => {\n      const box = element.getBoundingClientRect();\n      return { element, radiusX: box.width / 2, radiusY: box.height * 1.5 };\n    }) : [];\n    const mask = document.createElementNS(svgNamespace, \"mask\");\n    const trace = document.createElementNS(svgNamespace, \"path\");\n    const ball = document.createElement(\"span\");\n\n    cleanUp = () => {\n      for (const element of elements) element.style.removeProperty(\"clip-path\");\n      for (const { element } of bands) element.style.removeProperty(\"mask-image\");\n      for (const path of paths) path.removeAttribute(\"mask\");\n      mask.remove();\n      ball.remove();\n    };\n\n    mask.id = \"entrance-wire-mask\";\n    mask.setAttribute(\"maskUnits\", \"userSpaceOnUse\");\n    mask.setAttribute(\"x\", \"0\");\n    mask.setAttribute(\"y\", \"0\");\n    mask.setAttribute(\"width\", \"660\");\n    mask.setAttribute(\"height\", \"460\");\n    trace.setAttribute(\"d\", wire.dataset.trace);\n    trace.setAttribute(\"fill\", \"none\");\n    trace.setAttribute(\"stroke\", \"white\");\n    trace.setAttribute(\"stroke-width\", \"9\");\n    trace.setAttribute(\"stroke-linecap\", \"round\");\n    trace.setAttribute(\"stroke-linejoin\", \"round\");\n    mask.append(trace);\n    wire.append(mask);\n\n    const length = trace.getTotalLength();\n    trace.setAttribute(\"stroke-dasharray\", `${length} ${length}`);\n    trace.setAttribute(\"stroke-dashoffset\", String(length));\n    for (const path of paths) path.setAttribute(\"mask\", \"url(#entrance-wire-mask)\");\n\n    const tiles = collectTiles(elements);\n    for (const { element } of bands) element.style.maskImage = \"linear-gradient(transparent, transparent)\";\n    const matrix = wire.getScreenCTM();\n    const last = trace.getPointAtLength(length).matrixTransform(matrix);\n    const dot = launchDot.getBoundingClientRect();\n    const landing = { x: dot.left + dot.width / 2, y: dot.top + dot.height / 2 };\n    let shown = 0;\n    let startedAt;\n    ball.className = \"entrance-ball\";\n    ball.setAttribute(\"aria-hidden\", \"true\");\n    document.body.append(ball);\n    root.classList.replace(\"entrance-pending\", \"entrance-active\");\n\n    function tick(now) {\n      startedAt ??= now;\n      const elapsed = now - startedAt;\n      let x, y;\n      if (elapsed \u003c outlineDuration) {\n        const distance = length * elapsed / outlineDuration;\n        trace.setAttribute(\"stroke-dashoffset\", String(length - distance));\n        ({ x, y } = trace.getPointAtLength(distance).matrixTransform(matrix));\n      } else {\n        if (mask.isConnected) {\n          for (const path of paths) path.removeAttribute(\"mask\");\n          mask.remove();\n        }\n        const sinceOutline = elapsed - outlineDuration;\n        const reveal = Math.min(1, sinceOutline / revealDuration);\n        const count = Math.floor(reveal * tiles.length);\n        while (shown \u003c count) {\n          const { group, path } = tiles[shown++];\n          group.paths.push(path);\n          group.remaining--;\n          if (group.remaining) group.element.style.clipPath = `path(\"${group.paths.join(\" \")}\")`;\n          else group.element.style.removeProperty(\"clip-path\");\n        }\n        if (ripple && sinceOutline >= revealDuration) {\n          const progress = Math.min(1, (sinceOutline - revealDuration) / waveDuration);\n          const edge = progress * 120;\n          const solid = Math.max(0, edge - 13);\n          for (const { element, radiusX, radiusY } of bands) {\n            element.style.maskImage = `radial-gradient(ellipse ${radiusX}px ${radiusY}px at center, black ${solid}%, transparent ${edge}%)`;\n          }\n        }\n        const descent = Math.min(1, sinceOutline / (revealDuration + waveDuration));\n        x = last.x + (landing.x - last.x) * descent;\n        y = last.y + (landing.y - last.y) * descent ** 2;\n        if (descent === 1) {\n          finish();\n          return;\n        }\n      }\n\n      ball.style.transform = `translate(${x}px, ${y}px)`;\n      frameId = requestAnimationFrame(tick);\n    }\n\n    frameId = requestAnimationFrame(tick);\n  }\n\n  document.addEventListener(\"DOMContentLoaded\", () => {\n    function whenVisible() {\n      if (document.hidden) return;\n      document.removeEventListener(\"visibilitychange\", whenVisible);\n      requestAnimationFrame(() => {\n        try {\n          start();\n        } catch (error) {\n          finish();\n          console.error(\"Homepage entrance could not start\", error);\n        }\n      });\n    }\n    document.addEventListener(\"visibilitychange\", whenVisible);\n    whenVisible();\n  }, { once: true });\n})();\n\u003c/script>\n  \n  \n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#main\">Skip to content\u003c/a>\n  \u003cheader class=\"site-header\">\n    \u003ca class=\"wordmark\" data-preview-route=\"en-home\" href=\"#en-home\" aria-label=\"Lei Wang home\">LW\u003cspan>.\u003c/span>\u003c/a>\n    \u003cnav class=\"site-nav\" aria-label=\"Main navigation\">\n      \u003ca data-preview-route=\"en-home\" href=\"#en-home\" aria-current=\"page\">Home\u003c/a>\n      \u003ca data-preview-route=\"en-about\" href=\"#en-about\">About\u003c/a>\n      \u003ca data-preview-route=\"en-projects\" href=\"#en-projects\">Projects\u003c/a>\n      \u003ca data-preview-route=\"en-skills\" href=\"#en-skills\">Skills\u003c/a>\n      \u003ca data-preview-route=\"en-focus\" href=\"#en-focus\">Focus\u003c/a>\n    \u003c/nav>\n    \u003cnav class=\"language\" aria-label=\"Language\">\n      \u003cspan aria-current=\"true\">EN\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca data-preview-route=\"zh-home\" href=\"#zh-home\" lang=\"zh-CN\" hreflang=\"zh-CN\">中\u003c/a>\n    \u003c/nav>\n  \u003c/header>\n  \u003cmain class=\"home-main\" id=\"main\" tabindex=\"-1\">\n    \u003csection class=\"nameplate\" aria-labelledby=\"name\">\n      \u003csvg class=\"wire\" viewBox=\"0 0 660 460\" preserveAspectRatio=\"none\" fill=\"none\" aria-hidden=\"true\"\n           data-trace=\"M638 437V65L610 40H25V410L52 437H638L610 410H25V40L52 65V437V65H638L610 40V410\">\n        \u003cpath d=\"M25 40H610L638 65V437H52L25 410V40Z\"/>\n        \u003cpath d=\"M25 40 52 65H638M52 65V437M25 410H610L638 437M610 40V410\"/>\n      \u003c/svg>\n      \u003cspan class=\"wire-caption\">PARKING CODING POINT\u003c/span>\n      \u003ch1 id=\"name\" lang=\"en\">Lei (Leon) Wang\u003c/h1>\n      \u003cp class=\"visually-hidden\">AI Agent Engineer · LLM Application Engineer · Full-stack Developer\u003c/p>\n      \u003cdiv class=\"role\" data-titles=\"AI Agent Engineer|LLM Application Engineer|Full-stack Developer\">\n        \u003cspan class=\"role-display\" aria-hidden=\"true\">\n          \u003cspan data-role-text>AI Agent Engineer\u003c/span>\u003cspan class=\"caret\">\u003c/span>\n        \u003c/span>\n        \u003cbutton class=\"role-toggle\" type=\"button\" hidden data-role-toggle\n                aria-label=\"Pause job title animation\" data-pause=\"Pause job title animation\" data-resume=\"Resume job title animation\">\n          \u003csvg viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" fill=\"currentColor\" aria-hidden=\"true\">\n            \u003cpath class=\"pause-icon\" d=\"M4 3h2v10H4zm6 0h2v10h-2z\"/>\n            \u003cpath class=\"play-icon\" d=\"M5 2.8 13 8l-8 5.2z\"/>\n          \u003c/svg>\n        \u003c/button>\n      \u003c/div>\n      \u003cp class=\"intro\">\n        \u003cspan>I build AI agents and full-stack applications.\u003c/span>\n        \u003cspan>I care about how agents use tools and how their answers connect to evidence.\u003c/span>\n      \u003c/p>\n      \u003cul class=\"socials\" aria-label=\"Contact links\">\n        \u003cli>\n          \u003ca href=\"mailto:leonlei.wang@outlook.com\">\n            \u003c .6z\"/>\n            \u003c/svg>\u003c/span>\n            \u003cspan>LinkedIn\u003c/span>\n          \u003c/a>\n        \u003c/li>\n      \u003c/ul>\n    \u003c/section>\n  \u003c/main>\n  \u003cfooter class=\"site-footer home-footer\">\n    \u003cspan>© 2026 Lei Wang \u003ca class=\"versions-link\" href=\"https://leonleiwang.github.io/versions/\" target=\"_top\">Versions\u003c/a>\u003c/span>\n    \u003cbutton class=\"game-launch\" type=\"button\" hidden data-game-launch\n            aria-label=\"Play Breakout\" title=\"Play Breakout\">\n      \u003csvg width=\"25\" height=\"16\" viewBox=\"0 0 25 16\" fill=\"currentColor\" aria-hidden=\"true\">\n        \u003ccircle cx=\"12.5\" cy=\"4\" r=\"2.3\"/>\n        \u003crect x=\"2\" y=\"10\" width=\"21\" height=\"2.6\" rx=\"1.3\"/>\n      \u003c/svg>\n    \u003c/button>\n    \u003cspan class=\"motto\" lang=\"la\">Scientia ac Labore\u003c/span>\n  \u003c/footer>\n  \u003cdiv class=\"inline-game\" hidden data-game\n       data-playing=\"Move the paddle with your mouse, drag, or use the arrow keys. Press Escape to exit.\"\n       data-ready=\"Click or press Space to serve.\"\n       data-won=\"Page cleared.\">\n    \u003ccanvas class=\"inline-game-canvas\" tabindex=\"-1\" aria-label=\"Inline Breakout\">\u003c/canvas>\n    \u003cdiv class=\"inline-game-hud\">\n      \u003cspan data-game-time aria-hidden=\"true\">00:00:00\u003c/span>\n      \u003cbutton type=\"button\" class=\"inline-game-exit\" data-game-exit aria-label=\"Exit Breakout\" title=\"Exit Breakout\">×\u003c/button>\n    \u003c/div>\n    \u003cspan class=\"visually-hidden\" role=\"status\" data-game-status>\u003c/span>\n  \u003c/div>\n\u003cscript>\nconst role = document.querySelector(\"[data-titles]\");\nconst roleText = role.querySelector(\"[data-role-text]\");\nconst roleToggle = role.querySelector(\"[data-role-toggle]\");\nconst titles = role.dataset.titles.split(\"|\");\nconst reducedMotion = window.matchMedia(\"(prefers-reduced-motion: reduce)\");\n\nlet current = 0;\nlet length = titles[0].length;\nlet deleting = true;\nlet paused = false;\nlet timer;\n\nfunction advance() {\n  const title = titles[current];\n  length += deleting ? -1 : 1;\n  roleText.textContent = title.slice(0, length);\n\n  if (deleting && length === 0) {\n    current = (current + 1) % titles.length;\n    deleting = false;\n    timer = window.setTimeout(advance, 220);\n  } else if (!deleting && length === title.length) {\n    deleting = true;\n    timer = window.setTimeout(advance, 2300);\n  } else {\n    timer = window.setTimeout(advance, deleting ? 44 : 82);\n  }\n}\n\nfunction syncAnimation() {\n  window.clearTimeout(timer);\n  const canAnimate = !reducedMotion.matches;\n  const opening = document.documentElement.matches(\".entrance-pending, .entrance-active\");\n  const running = canAnimate && !paused && !opening && !document.hidden &&\n    !document.body.classList.contains(\"game-active\");\n\n  roleToggle.hidden = !canAnimate;\n  role.dataset.running = String(running);\n  role.dataset.paused = String(paused);\n  const action = paused ? roleToggle.dataset.resume : roleToggle.dataset.pause;\n  roleToggle.setAttribute(\"aria-label\", action);\n  roleToggle.title = action;\n\n  if (!running) {\n    roleText.textContent = titles[current];\n    length = titles[current].length;\n    deleting = true;\n    return;\n  }\n\n  timer = window.setTimeout(advance, 2300);\n}\n\nroleToggle.addEventListener(\"click\", () => {\n  paused = !paused;\n  syncAnimation();\n});\ndocument.addEventListener(\"visibilitychange\", syncAnimation);\ndocument.addEventListener(\"inlinegamechange\", syncAnimation);\ndocument.addEventListener(\"siteentranceend\", syncAnimation);\nreducedMotion.addEventListener(\"change\", syncAnimation);\nsyncAnimation();\n\n\u003c/script>\n\u003cscript>\n(() => {\n  const game = document.querySelector(\"[data-game]\");\n  const canvas = game.querySelector(\"canvas\");\n  const context = canvas.getContext(\"2d\");\n  if (!context) return;\n\n  const nameplate = document.querySelector(\".nameplate\");\n  const launch = document.querySelector(\"[data-game-launch]\");\n  const exit = game.querySelector(\"[data-game-exit]\");\n  const clock = game.querySelector(\"[data-game-time]\");\n  const status = game.querySelector(\"[data-game-status]\");\n  const ballSpeed = 300;\n  const pressed = new Set();\n  const paddle = { x: 0, y: 0, width: 78, height: 6 };\n  const ball = { x: 0, y: 0, radius: 5, vx: 0, vy: 0 };\n\n  let width, height, origin, startedAt, lastFrame, frameId;\n  let targets = [];\n  const damaged = new Set();\n  let playing = false;\n  let pointer;\n\n  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));\n\n  function textTargets() {\n    const result = [];\n    const selector = \".wire-caption, h1, [data-role-text], .intro span, .socials a > span:not(.social-icon)\";\n    const range = document.createRange();\n    for (const element of nameplate.querySelectorAll(selector)) {\n      const node = element.firstChild;\n      if (!node || node.nodeType !== Node.TEXT_NODE) continue;\n      const health = element.matches(\"h1\") ? 2 : 1;\n      let offset = 0;\n      for (const character of node.data) {\n        const start = offset;\n        offset += character.length;\n        if (!character.trim()) continue;\n        range.setStart(node, start);\n        range.setEnd(node, offset);\n        const { x, y, width, height } = range.getBoundingClientRect();\n        if (width && height) result.push({ x, y, width, height, health });\n      }\n    }\n    for (const icon of nameplate.querySelectorAll(\".social-icon svg\")) {\n      const { x, y, width, height } = icon.getBoundingClientRect();\n      result.push({ x, y, width, height, health: 2 });\n    }\n    return result;\n  }\n\n  function wireTargets() {\n    const result = [];\n    for (const path of nameplate.querySelectorAll(\".wire path\")) {\n      const matrix = path.getScreenCTM();\n      const scale = Math.max(Math.hypot(matrix.a, matrix.b), Math.hypot(matrix.c, matrix.d));\n      const length = path.getTotalLength();\n      const step = 10 / scale;\n      let previous = path.getPointAtLength(0).matrixTransform(matrix);\n      for (let distance = step; distance \u003c length + step; distance += step) {\n        const point = path.getPointAtLength(Math.min(distance, length)).matrixTransform(matrix);\n        const size = Math.hypot(point.x - previous.x, point.y - previous.y);\n        // Do not create a target across a jump to another SVG subpath.\n        if (size > 0 && size \u003c= 11) result.push({ wire: true, from: previous, to: point, health: 1 });\n        previous = point;\n      }\n    }\n    return result;\n  }\n\n  function paintDamage() {\n    const marks = Array.from(damaged, (target) => {\n      if (target.wire) {\n        const { from, to } = target;\n        return `\u003cpath d=\"M${from.x - origin.x} ${from.y - origin.y}L${to.x - origin.x} ${to.y - origin.y}\" stroke=\"black\" stroke-width=\"3\"/>`;\n      }\n      const shade = target.health ? \"#b3b3b3\" : \"black\";\n      return `\u003crect x=\"${target.x - origin.x}\" y=\"${target.y - origin.y}\" width=\"${target.width}\" height=\"${target.height}\" fill=\"${shade}\"/>`;\n    }).join(\"\");\n    const mask = `\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 ${origin.width} ${origin.height}\">\u003crect width=\"100%\" height=\"100%\" fill=\"white\"/>${marks}\u003c/svg>`;\n    nameplate.style.maskImage = `url(\"data:image/svg+xml,${encodeURIComponent(mask)}\")`;\n    nameplate.style.maskSize = \"100% 100%\";\n    nameplate.style.maskMode = \"luminance\";\n  }\n\n  function restoreNameplate() {\n    nameplate.style.removeProperty(\"mask-image\");\n    nameplate.style.removeProperty(\"mask-size\");\n    nameplate.style.removeProperty(\"mask-mode\");\n    damaged.clear();\n  }\n\n  function movePaddle(center) {\n    paddle.x = clamp(center - paddle.width / 2, 0, width - paddle.width);\n  }\n\n  function dockBall() {\n    ball.x = paddle.x + paddle.width / 2;\n    ball.y = paddle.y - ball.radius - 1;\n  }\n\n  function draw() {\n    context.clearRect(0, 0, width, height);\n    context.fillStyle = \"#293b47\";\n    context.beginPath();\n    context.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 3);\n    context.fill();\n    context.fillStyle = \"#376772\";\n    context.beginPath();\n    context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);\n    context.fill();\n  }\n\n  function nearestPoint(target) {\n    if (!target.wire) {\n      return {\n        x: clamp(ball.x, target.x, target.x + target.width),\n        y: clamp(ball.y, target.y, target.y + target.height),\n      };\n    }\n    const { from, to } = target;\n    const dx = to.x - from.x;\n    const dy = to.y - from.y;\n    const t = clamp(((ball.x - from.x) * dx + (ball.y - from.y) * dy) / (dx * dx + dy * dy), 0, 1);\n    return { x: from.x + t * dx, y: from.y + t * dy };\n  }\n\n  function advance(dt) {\n    const oldY = ball.y;\n    ball.x += ball.vx * dt;\n    ball.y += ball.vy * dt;\n\n    if (ball.x \u003c ball.radius || ball.x > width - ball.radius) {\n      ball.x = clamp(ball.x, ball.radius, width - ball.radius);\n      ball.vx *= -1;\n    }\n    if (ball.y \u003c ball.radius) {\n      ball.y = ball.radius;\n      ball.vy = Math.abs(ball.vy);\n    }\n\n    const atPaddle = oldY + ball.radius \u003c= paddle.y && ball.y + ball.radius >= paddle.y;\n    if (ball.vy > 0 && atPaddle && ball.x + ball.radius >= paddle.x &&\n        ball.x - ball.radius \u003c= paddle.x + paddle.width) {\n      const offset = clamp((ball.x - paddle.x) / paddle.width * 2 - 1, -1, 1);\n      const angle = offset * 0.98;\n      ball.y = paddle.y - ball.radius;\n      ball.vx = Math.sin(angle) * ballSpeed;\n      ball.vy = -Math.cos(angle) * ballSpeed;\n    }\n\n    for (const target of targets) {\n      if (target.health === 0) continue;\n      const point = nearestPoint(target);\n      const dx = ball.x - point.x;\n      const dy = ball.y - point.y;\n      const distance = Math.hypot(dx, dy);\n      if (distance === 0 || distance > ball.radius) continue;\n      const nx = dx / distance;\n      const ny = dy / distance;\n      const approach = ball.vx * nx + ball.vy * ny;\n      if (approach >= 0) continue;\n\n      // Separate the ball from this surface before the next physics step.\n      ball.x = point.x + nx * (ball.radius + 0.05);\n      ball.y = point.y + ny * (ball.radius + 0.05);\n      ball.vx -= 2 * approach * nx;\n      ball.vy -= 2 * approach * ny;\n      target.health--;\n      damaged.add(target);\n      return true;\n    }\n    return false;\n  }\n\n  function waitForServe() {\n    playing = false;\n    game.dataset.phase = \"ready\";\n    status.textContent = game.dataset.ready;\n    dockBall();\n  }\n\n  function serve() {\n    dockBall();\n    const aim = targets.filter((target) => !target.wire && target.health > 0 &&\n      target.y \u003c ball.y && Math.abs(target.x + target.width / 2 - ball.x) \u003c 32)\n      .sort((a, b) => b.y - a.y)[0];\n    const angle = aim\n      ? Math.atan2(aim.x + aim.width / 2 - ball.x, ball.y - aim.y)\n      : (ball.x > width / 2 ? -0.32 : 0.32);\n    ball.vx = Math.sin(angle) * ballSpeed;\n    ball.vy = -Math.cos(angle) * ballSpeed;\n    startedAt ??= performance.now();\n    playing = true;\n    game.dataset.phase = \"playing\";\n    status.textContent = game.dataset.playing;\n  }\n\n  function tick(now) {\n    const dt = Math.min((now - lastFrame) / 1000, 0.032);\n    lastFrame = now;\n    const direction = Number(pressed.has(\"ArrowRight\")) - Number(pressed.has(\"ArrowLeft\"));\n    if (direction) movePaddle(paddle.x + paddle.width / 2 + direction * 470 * dt);\n\n    if (playing) {\n      let hit = false;\n      const steps = Math.max(1, Math.ceil(dt * 240));\n      for (let i = 0; i \u003c steps; i++) {\n        if (advance(dt / steps)) hit = true;\n      }\n      if (hit) paintDamage();\n      if (hit && targets.every((target) => target.health === 0)) {\n        playing = false;\n        game.dataset.phase = \"complete\";\n        status.textContent = game.dataset.won;\n      } else if (ball.y - ball.radius > height) {\n        waitForServe();\n      }\n    } else {\n      dockBall();\n    }\n    draw();\n\n    if (startedAt !== undefined) {\n      const centiseconds = Math.floor(Math.max(0, now - startedAt) / 10);\n      const fields = [Math.floor(centiseconds / 6000), Math.floor(centiseconds / 100) % 60, centiseconds % 100];\n      clock.textContent = fields.map((field) => String(field).padStart(2, \"0\")).join(\":\");\n    }\n\n    if (game.dataset.phase !== \"complete\") frameId = requestAnimationFrame(tick);\n  }\n\n  function openGame() {\n    cancelAnimationFrame(frameId);\n    restoreNameplate();\n    pressed.clear();\n    pointer = undefined;\n    document.body.classList.add(\"game-active\");\n    document.dispatchEvent(new Event(\"inlinegamechange\"));\n    game.hidden = false;\n\n    const view = canvas.getBoundingClientRect();\n    width = view.width;\n    height = view.height;\n    const ratio = Math.min(window.devicePixelRatio || 1, 2);\n    canvas.width = Math.round(width * ratio);\n    canvas.height = Math.round(height * ratio);\n    context.setTransform(ratio, 0, 0, ratio, 0, 0);\n\n    origin = nameplate.getBoundingClientRect();\n    targets = [...wireTargets(), ...textTargets()];\n    const footerButton = launch.getBoundingClientRect();\n    paddle.y = clamp(footerButton.top + footerButton.height / 2 + 3, height - 72, height - 28);\n    movePaddle(width / 2);\n    waitForServe();\n    clock.textContent = \"00:00:00\";\n    canvas.focus({ preventScroll: true });\n    startedAt = undefined;\n    lastFrame = performance.now();\n    draw();\n    frameId = requestAnimationFrame(tick);\n  }\n\n  function stop(returnFocus = false) {\n    if (game.hidden) return;\n    cancelAnimationFrame(frameId);\n    playing = false;\n    pressed.clear();\n    pointer = undefined;\n    game.hidden = true;\n    restoreNameplate();\n    document.body.classList.remove(\"game-active\");\n    document.dispatchEvent(new Event(\"inlinegamechange\"));\n    if (returnFocus) launch.focus({ preventScroll: true });\n  }\n\n  function startGesture(event) {\n    if (event.button !== 0 || !event.isPrimary || pointer || game.dataset.phase === \"complete\") return;\n    pointer = {\n      id: event.pointerId,\n      x: event.clientX,\n      y: event.clientY,\n      ready: game.dataset.phase === \"ready\",\n      dragged: false,\n    };\n    canvas.setPointerCapture(event.pointerId);\n  }\n\n  function moveGesture(event) {\n    if (pointer?.id !== event.pointerId) {\n      if (playing && event.pointerType === \"mouse\" && !pointer) movePaddle(event.clientX);\n      return;\n    }\n    if (Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y) > 6) pointer.dragged = true;\n    if (pointer.dragged) movePaddle(event.clientX);\n  }\n\n  launch.addEventListener(\"pointerdown\", (event) => {\n    if (event.button !== 0 || !event.isPrimary || !game.hidden) return;\n    openGame();\n    startGesture(event);\n  });\n  launch.addEventListener(\"click\", (event) => {\n    // Keyboard and assistive activation do not generate pointer events.\n    if (event.detail === 0 && game.hidden) {\n      openGame();\n      serve();\n    }\n  });\n  exit.addEventListener(\"click\", () => stop(true));\n  canvas.addEventListener(\"pointermove\", moveGesture);\n  canvas.addEventListener(\"pointerdown\", startGesture);\n  canvas.addEventListener(\"pointerup\", (event) => {\n    if (pointer?.id !== event.pointerId) return;\n    moveGesture(event);\n    if (pointer.ready && !pointer.dragged && game.dataset.phase === \"ready\") serve();\n    pointer = undefined;\n  });\n  function clearGesture(event) {\n    if (pointer?.id === event.pointerId) pointer = undefined;\n  }\n  canvas.addEventListener(\"pointercancel\", clearGesture);\n  canvas.addEventListener(\"lostpointercapture\", clearGesture);\n  document.addEventListener(\"keydown\", (event) => {\n    if (game.hidden) return;\n    if (event.key === \"Escape\") {\n      event.preventDefault();\n      stop(true);\n    } else if (game.dataset.phase !== \"complete\" && (event.key === \"ArrowLeft\" || event.key === \"ArrowRight\")) {\n      event.preventDefault();\n      pressed.add(event.key);\n    } else if (event.target === canvas && game.dataset.phase === \"ready\" &&\n               (event.key === \" \" || event.key === \"Enter\")) {\n      event.preventDefault();\n      if (!event.repeat) serve();\n    }\n  });\n  document.addEventListener(\"keyup\", (event) => pressed.delete(event.key));\n  window.addEventListener(\"blur\", () => pressed.clear());\n  window.addEventListener(\"resize\", () => stop());\n  window.addEventListener(\"scroll\", () => stop(), { passive: true });\n\n  launch.hidden = false;\n})();\n\u003c/script>\n\u003cscript>\ndocument.addEventListener(\"click\", (event) => {\n  const link = event.target.closest(\"a[data-preview-route]\");\n  if (!link) return;\n  event.preventDefault();\n  parent.postMessage({ type: \"lei-wang-preview-route\", route: link.dataset.previewRoute }, \"*\");\n});\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n\n","en-about":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Meet Lei Wang, an engineer working on AI agents, retrieval-augmented generation, and full-stack applications.\">\n  \u003cmeta property=\"og:type\" content=\"website\">\n  \u003cmeta property=\"og:title\" content=\"About · Lei Wang\">\n  \u003cmeta property=\"og:description\" content=\"Meet Lei Wang, an engineer working on AI agents, retrieval-augmented generation, and full-stack applications.\">\n  \u003ctitle>About · Lei Wang\u003c/title>\n  \u003cbase href=\"about:srcdoc\">\n  \u003cstyle>\n:root {\n  color-scheme: ligh {\n  display: grid;\n  flex: none;\n  place-items: center;\n  width: 32px;\n  height: 44px;\n  padding: 0;\n  border: 0;\n  border-radius: 4px;\n  color: var(--muted);\n  background: transparent;\n  cursor: pointer;\n}\n\n.role-toggle:hover { color: var(--accent); }\n.role-toggle[hidden], .play-icon, .role[data-paused=\"true\"] .pause-icon { display: none; }\n.role[data-paused=\"true\"] .play-icon { display: block; }\n\n.caret {\n  display: inline-block;\n  flex: none;\n  width: 1px;\n  height: 1.1em;\n  margin-left: 3px;\n  background: currentColor;\n  opacity: 0;\n}\n\n.role[data-running=\"true\"] .caret { animation: blink 1s step-end infinite; }\n@keyframes blink { 0%, 49% { opacity: 1; } }\n\n.intro {\n  max-width: 390px;\n  margin: 15px auto 0;\n  color: var(--body);\n  font-size: 14px;\n  line-height: 1.85;\n  text-wrap: pretty;\n}\n\n.intro span { display: block; }\n\n.socials {\n  display: flex;\n  justify-content: center;\n  gap: 33px;\n  margin: 37px 0 0;\n  padding: 0;\n  list-style: none;\n}\n\n.socials a {\n  display: grid;\n  justify-items: center;\n  gap: 9px;\n  color: var(--muted);\n  font: 11px var(--mono);\n}\n\n.social-icon {\n  display: grid;\n  place-items: center;\n  width: 46px;\n  height: 46px;\n  border: 1px solid var(--line);\n  border-radius: 50%;\n  color: var(--ink);\n  transition: color .18s, border-color .18s, transform .18s;\n}\n\n.socials a:hover .social-icon,\n.socials a:focus-visible .social-icon {\n  border-color: var(--accent);\n  color: var(--accent);\n  transform: translateY(-2px);\n}\n\n.social-icon svg { width: 20px; height: 20px; }\n.icon-cutout { fill: var(--paper); }\n\n.site-footer {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  gap: 10px;\n  padding: 17px 5.5% 23px;\n  color: var(--muted);\n  font-size: 11px;\n}\n\n.home-footer {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  padding-top: 4px;\n}\n\n.home-footer .motto { grid-column: 3; justify-self: end; }\n\n.game-launch,\n.inline-game button {\n  border: 0;\n  border-radius: 4px;\n  color: var(--muted);\n  background: transparent;\n  font: inherit;\n  cursor: pointer;\n}\n\n.game-launch {\n  display: grid;\n  place-items: center;\n  width: 44px;\n  height: 40px;\n  padding: 0;\n  touch-action: none;\n  user-select: none;\n}\n\n.game-launch:hover,\n.inline-game button:hover { color: var(--accent); }\n\n.game-launch[hidden],\n.inline-game[hidden] { display: none; }\n\n.game-active .game-launch,\n.entrance-active .game-launch,\n.entrance-pending .site-header,\n.entrance-pending .nameplate,\n.entrance-pending .home-footer { visibility: hidden; }\n\n.entrance-ball {\n  position: fixed;\n  z-index: 2;\n  top: -5px;\n  left: -5px;\n  width: 10px;\n  height: 10px;\n  border-radius: 50%;\n  background: var(--accent);\n  pointer-events: none;\n}\n\n.inline-game {\n  position: fixed;\n  z-index: 3;\n  inset: 0;\n  pointer-events: none;\n}\n\n.inline-game-canvas {\n  display: block;\n  width: 100%;\n  height: 100%;\n  outline: none;\n  pointer-events: auto;\n  touch-action: none;\n}\n\n.inline-game-hud {\n  position: absolute;\n  top: 10px;\n  right: 12px;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  color: var(--muted);\n  font: 11px var(--mono);\n}\n\n.inline-game button { pointer-events: auto; }\n\n.inline-game .inline-game-exit {\n  width: 32px;\n  height: 36px;\n  font-size: 21px;\n}\n\n.content {\n  width: min(780px, calc(100% - 56px));\n  margin: 0 auto;\n  padding: 72px 0 88px;\n}\n\n.eyebrow {\n  margin: 0 0 16px;\n  color: var(--muted);\n  font: 11px/1.5 var(--mono);\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.content h1 {\n  margin: 0 0 24px;\n  font: 400 clamp(35px, 5.2vw, 53px)/1.12 Georgia, \"Times New Roman\", \"Songti SC\", serif;\n  letter-spacing: -.033em;\n  text-wrap: balance;\n}\n\n.content p:not(.eyebrow) {\n  max-width: 64ch;\n  margin: 0 0 16px;\n  color: var(--body);\n  font-size: 15px;\n  line-height: 1.85;\n}\n\n.content p.lead { font-size: 17px; }\n\n.content-link {\n  display: inline-block;\n  margin-top: 14px;\n  padding-block: 6px;\n  color: var(--accent);\n  font-size: 14px;\n  text-decoration: underline;\n  text-underline-offset: 4px;\n}\n\n.entries {\n  margin: 32px 0 14px;\n  padding: 0;\n  list-style: none;\n}\n\n.entry {\n  display: grid;\n  grid-template-columns: 28px minmax(0, 1fr);\n  gap: 13px;\n  padding: 22px 0;\n  border-top: 1px solid var(--line);\n}\n\n.entry:last-child { border-bottom: 1px solid var(--line); }\n.entry-number { padding-top: 6px; color: var(--muted); font: 11px var(--mono); }\n.entry h2 { margin: 0 0 7px; font-size: 19px; font-weight: 550; overflow-wrap: anywhere; }\n.entry h2 a { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }\n.entry h2 a:hover { color: var(--accent); }\n.entry h2 a span { color: var(--accent); }\n.content p.entry-description { margin-bottom: 9px; }\n.content p.tags { margin-bottom: 0; font: 11px/1.65 var(--mono); color: var(--muted); }\n\n@media (max-width: 600px) {\n  .site-header { min-height: 68px; padding: 0 20px; }\n  .site-nav { gap: clamp(12px, 4.4vw, 24px); }\n  .site-nav a { font-size: 12px; }\n  .language { gap: 5px; font-size: 11px; }\n  .wordmark { font-size: 15px; }\n  .home-main { padding: 4px 16px 28px; }\n  .nameplate { padding: 72px 32px 60px; }\n  .wire-caption { padding: 0 6px; font-size: 8px; }\n  .role { font-size: clamp(12px, 3.5vw, 15px); }\n  .intro { font-size: 13px; }\n  .socials { gap: 23px; margin-top: 29px; }\n  .socials a { font-size: 10px; }\n  .site-footer { padding: 13px 20px 19px; font-size: 10px; }\n  .content { width: calc(100% - 44px); padding: 49px 0 64px; }\n  .entry { grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }\n}\n\n@media (max-width: 355px) {\n  .site-header { padding-inline: 13px; }\n  .site-nav { gap: 8px; }\n  .nameplate { padding-inline: 27px; }\n  .socials { gap: 16px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .social-icon { transition: none; }\n  .role[data-running=\"true\"] .caret { animation: none; }\n}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003ca class=\"skip-link\" href=\"#main\">Skip to content\u003c/a>\n  \u003cheader class=\"site-header\">\n    \u003ca class=\"wordmark\" data-preview-route=\"en-home\" href=\"#en-home\" aria-label=\"Lei Wang home\">LW\u003cspan>.\u003c/span>\u003c/a>\n    \u003cnav class=\"site-nav\" aria-label=\"Main navigation\">\n      \u003ca data-preview-route=\"en-home\" href=\"#en-home\">Home\u003c/a>\n      \u003ca data-preview-route=\"en-about\" href=\"#en-about\">About\u003c/a>\n      \u003ca data-preview-route=\"en-projects\" href=\"#en-projects\" aria-current=\"page\">Projects\u003c/a>\n      \u003ca data-preview-route=\"en-skills\" href=\"#en-skills\">Skills\u003c/a>\n      \u003ca data-preview-route=\"en-focus\" href=\"#en-focus\">Focus\u003c/a>\n    \u003c/nav>\n    \u003cnav class=\"language\" aria-label=\"Language\">\n      \u003cspan aria-current=\"true\">EN\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca data-preview-route=\"zh-projects\" href=\"#zh-projects\" lang=\"zh-CN\" hreflang=\"zh-CN\">中\u003c/a>\n    \u003c/nav>\n  \u003c/header>\n  \u003cmain class=\"content\" id=\"main\" tabindex=\"-1\">\n    \u003cp class=\"eyebrow\">Selected work\u003c/p>\n    \u003ch1>Things I’ve been building.\u003c/h1>\n    \u003cp class=\"lead\">Feel free to try my projects, give them a star &amp; connect with me!\u003c/p>\n    \u003col class=\"entries\">\n      \u003cli class=\"entry\">\n        \u003cspan class=\"entry-number\" aria-hidden=\"true\">01\u003c/span>\n        \u003cdiv>\n          \u003ch2>\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://github.com/leonleiwang/ShopMind-AI\">ShopMind AI \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/h2>\n          \u003cp class=\"entry-description\">A conversational commerce project that connects product discovery, orders, support, and agent evaluation in one application.\u003c/p>\n          \u003cp class=\"tags\">LangGraph · FastAPI · Next.js · RAG\u003c/p>\n        \u003c/div>\n      \u003c/li>\n      \u003cli class=\"entry\">\n        \u003cspan class=\"entry-number\" aria-hidden=\"true\">02\u003c/span>\n        \u003cdiv>\n          \u003ch2>\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://github.com/leonleiwang/ContactFlow-AI\">ContactFlow AI \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/h2>\n          \u003cp class=\"entry-description\">A customer support prototype that combines ticket workflows, AI assistance, and retrieval with traceable sources. It includes fallback paths for when a model is unavailable.\u003c/p>\n          \u003cp class=\"tags\">Spring Boot · FastAPI · React · RAG\u003c/p>\n        \u003c/div>\n      \u003c/li>\n      \u003cli class=\"entry\">\n        \u003cspan class=\"entry-number\" aria-hidden=\"true\">03\u003c/span>\n        \u003cdiv>\n          \u003ch2>\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://github.com/leonleiwang/recruiter-na-codexharness\">recruiter-na-codexharness \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/h2>\n          \u003cp class=\"entry-description\">An open-source developer preview of a DingTalk recruiting assistant. It turns hiring requests into job descriptions and supports resume screening with traceable evidence.\u003c/p>\n          \u003cp class=\"tags\">Codex Harness · Python · DingTalk\u003c/p>\n        \u003c/div>\n      \u003c/li>\n      \u003cli class=\"entry\">\n        \u003cspan class=\"entry-number\" aria-hidden=\"true\">04\u003c/span>\n        \u003cdiv>\n          \u003ch2>\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://github.com/leonleiwang/codexharness-im\">codexharness-im \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/h2>\n          \u003cp class=\"entry-description\">A reusable messaging bridge for Codex-based agents. It separates channel adapters, sessions, and progress updates from each project’s business logic.\u003c/p>\n          \u003cp class=\"tags\">JavaScript · Agent Runtime · IM Adapters\u003c/p>\n        \u003c/div>\n      \u003c/li>\n    \u003c/ol>\n    \u003ca class=\"content-link\" href=\"https://github.com/leonleiwang?tab=repositories\">More on GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n  \u003c/main>\n  \u003cfooter class=\"site-footer\">\n    \u003cspan>© 2026 Lei Wang\u003c/span>\n    \u003cspan class=\"motto\" lang=\"la\">Scientia ac Labore\u003c/span>\n  \u003c/footer>\n\n\u003cscript>\ndocument.addEventListener(\"click\", (event) => {\n  const link = event.target.closest(\"a[data-preview-route]\");\n  if (!link) return;\n  event.preventDefault();\n  parent.postMessage({ type: \"lei-wang-preview-route\", route: link.dataset.previewRoute }, \"*\");\n});\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n\n","en-focus":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Lei Wang’s interests in agent tool use, evidence in retrieval, and evaluation of agent behavior.\">\n  \u003cmeta property=\"og:type\" content=\"website\">\n  \u003cmeta property=\"og:title\" content=\"Focus · Lei Wang\">\n  \u003cmeta property=\"og:description\" content=\"Lei Wang’s interests in agent tool use, evidence in retrieval, and evaluation of agent behavior.\">\n  \u003ctitle>Focus · Lei Wang\u003c/title>\n  \u003cbase href=\"about:srcdoc\">\n  \u003cstyle>\n:root {\n  color-scheme: light;\n  --paper: #fcfbf8;\n  --ink: #293b47;\n  --body: #575f64;\n  --muted: #677176;\n  --accent: #376772;\n  --line: #e1e3dd;\n  --wire: #c5cfca;\n  --mono: ui-monospace, SFMono-Regular, Consolas, monospace;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  display: flex;\n  flex-direction: column;\n  min-height: 100vh;\n  min-height: 10 03cspan>© 2026 Lei Wang \u003ca class=\"versions-link\" href=\"https://leonleiwang.github.io/versions/\" target=\"_top\">版本\u003c/a>\u003c/span>\n    \u003cbutton class=\"game-launch\" type=\"button\" hidden data-game-launch\n            aria-label=\"玩弹球\" title=\"玩弹球\">\n      \u003csvg width=\"25\" height=\"16\" viewBox=\"0 0 25 16\" fill=\"currentColor\" aria-hidden=\"true\">\n        \u003ccircle cx=\"12.5\" cy=\"4\" r=\"2.3\"/>\n        \u003crect x=\"2\" y=\"10\" width=\"21\" height=\"2.6\" rx=\"1.3\"/>\n      \u003c/svg>\n    \u003c/button>\n    \u003cspan class=\"motto\" lang=\"la\">Scientia ac Labore\u003c/span>\n  \u003c/footer>\n  \u003cdiv class=\"inline-game\" hidden data-game\n       data-playing=\"用鼠标、拖动或左右方向键控制挡板。按 Esc 退出。\"\n       data-ready=\"点击或按空格发球。\"\n       data-won=\"首页已清空。\">\n    \u003ccanvas class=\"inline-game-canvas\" tabindex=\"-1\" aria-label=\"首页弹球\">\u003c/canvas>\n    \u003cdiv class=\"inline-game-hud\">\n      \u003cspan data-game-time aria-hidden=\"true\">00:00:00\u003c/span>\n      \u003cbutton type=\"button\" class=\"inline-game-exit\" data-game-exit aria-label=\"退出弹球\" title=\"退出弹球\">×\u003c/button>\n    \u003c/div>\n    \u003cspan class=\"visually-hidden\" role=\"status\" data-game-status>\u003c/span>\n  \u003c/div>\n\u003cscript>\nconst role = document.querySelector(\"[data-titles]\");\nconst roleText = role.querySelector(\"[data-role-text]\");\nconst roleToggle = role.querySelector(\"[data-role-toggle]\");\nconst titles = role.dataset.titles.split(\"|\");\nconst reducedMotion = window.matchMedia(\"(prefers-reduced-motion: reduce)\");\n\nlet current = 0;\nlet length = titles[0].length;\nlet deleting = true;\nlet paused = false;\nlet timer;\n\nfunction advance() {\n  const title = titles[current];\n  length += deleting ? -1 : 1;\n  roleText.textContent = title.slice(0, length);\n\n  if (deleting && length === 0) {\n    current = (current + 1) % titles.length;\n    deleting = false;\n    timer = window.setTimeout(advance, 220);\n  } else if (!deleting && length === title.length) {\n    deleting = true;\n    timer = window.setTimeout(advance, 2300);\n  } else {\n    timer = window.setTimeout(advance, deleting ? 44 : 82);\n  }\n}\n\nfunction syncAnimation() {\n  window.clearTimeout(timer);\n  const canAnimate = !reducedMotion.matches;\n  const opening = document.documentElement.matches(\".entrance-pending, .entrance-active\");\n  const running = canAnimate && !paused && !opening && !document.hidden &&\n    !document.body.classList.contains(\"game-active\");\n\n  roleToggle.hidden = !canAnimate;\n  role.dataset.running = String(running);\n  role.dataset.paused = String(paused);\n  const action = paused ? roleToggle.dataset.resume : roleToggle.dataset.pause;\n  roleToggle.setAttribute(\"aria-label\", action);\n  roleToggle.title = action;\n\n  if (!running) {\n    roleText.textContent = titles[current];\n    length = titles[current].length;\n    deleting = true;\n    return;\n  }\n\n  timer = window.setTimeout(advance, 2300);\n}\n\nroleToggle.addEventListener(\"click\", () => {\n  paused = !paused;\n  syncAnimation();\n});\ndocument.addEventListener(\"visibilitychange\", syncAnimation);\ndocument.addEventListener(\"inlinegamechange\", syncAnimation);\ndocument.addEventListener(\"siteentranceend\", syncAnimation);\nreducedMotion.addEventListener(\"change\", syncAnimation);\nsyncAnimation();\n\n\u003c/script>\n\u003cscript>\n(() => {\n  const game = document.querySelector(\"[data-game]\");\n  const canvas = game.querySelector(\"canvas\");\n  const context = canvas.getContext(\"2d\");\n  if (!context) return;\n\n  const nameplate = document.querySelector(\".nameplate\");\n  const launch = document.querySelector(\"[data-game-launch]\");\n  const exit = game.querySelector(\"[data-game-exit]\");\n  const clock = game.querySelector(\"[data-game-time]\");\n  const status = game.querySelector(\"[data-game-status]\");\n  const ballSpeed = 300;\n  const pressed = new Set();\n  const paddle = { x: 0, y: 0, width: 78, height: 6 };\n  const ball = { x: 0, y: 0, radius: 5, vx: 0, vy: 0 };\n\n  let width, height, origin, startedAt, lastFrame, frameId;\n  let targets = [];\n  const damaged = new Set();\n  let playing = false;\n  let pointer;\n\n  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));\n\n  function textTargets() {\n    const result = [];\n    const selector = \".wire-caption, h1, [data-role-text], .intro span, .socials a > span:not(.social-icon)\";\n    const range = document.createRange();\n    for (const element of nameplate.querySelectorAll(selector)) {\n      const node = element.firstChild;\n      if (!node || node.nodeType !== Node.TEXT_NODE) continue;\n      const health = element.matches(\"h1\") ? 2 : 1;\n      let offset = 0;\n      for (const character of node.data) {\n        const start = offset;\n        offset += character.length;\n        if (!character.trim()) continue;\n        range.setStart(node, start);\n        range.setEnd(node, offset);\n        const { x, y, width, height } = range.getBoundingClientRect();\n        if (width && height) result.push({ x, y, width, height, health });\n      }\n    }\n    for (const icon of nameplate.querySelectorAll(\".social-icon svg\")) {\n      const { x, y, width, height } = icon.getBoundingClientRect();\n      result.push({ x, y, width, height, health: 2 });\n    }\n    return result;\n  }\n\n  function wireTargets() {\n    const result = [];\n    for (const path of nameplate.querySelectorAll(\".wire path\")) {\n      const matrix = path.getScreenCTM();\n      const scale = Math.max(Math.hypot(matrix.a, matrix.b), Math.hypot(matrix.c, matrix.d));\n      const length = path.getTotalLength();\n      const step = 10 / scale;\n      let previous = path.getPointAtLength(0).matrixTransform(matrix);\n      for (let distance = step; distance \u003c length + step; distance += step) {\n        const point = path.getPointAtLength(Math.min(distance, length)).matrixTransform(matrix);\n        const size = Math.hypot(point.x - previous.x, point.y - previous.y);\n        // Do not create a target across a jump to another SVG subpath.\n        if (size > 0 && size \u003c= 11) result.push({ wire: true, from: previous, to: point, health: 1 });\n        previous = point;\n      }\n    }\n    return result;\n  }\n\n  function paintDamage() {\n    const marks = Array.from(damaged, (target) => {\n      if (target.wire) {\n        const { from, to } = target;\n        return `\u003cpath d=\"M${from.x - origin.x} ${from.y - origin.y}L${to.x - origin.x} ${to.y - origin.y}\" stroke=\"black\" stroke-width=\"3\"/>`;\n      }\n      const shade = target.health ? \"#b3b3b3\" : \"black\";\n      return `\u003crect x=\"${target.x - origin.x}\" y=\"${target.y - origin.y}\" width=\"${target.width}\" height=\"${target.height}\" fill=\"${shade}\"/>`;\n    }).join(\"\");\n    const mask = `\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 ${origin.width} ${origin.height}\">\u003crect width=\"100%\" height=\"100%\" fill=\"white\"/>${marks}\u003c/svg>`;\n    nameplate.style.maskImage = `url(\"data:image/svg+xml,${encodeURIComponent(mask)}\")`;\n    nameplate.style.maskSize = \"100% 100%\";\n    nameplate.style.maskMode = \"luminance\";\n  }\n\n  function restoreNameplate() {\n    nameplate.style.removeProperty(\"mask-image\");\n    nameplate.style.removeProperty(\"mask-size\");\n    nameplate.style.removeProperty(\"mask-mode\");\n    damaged.clear();\n  }\n\n  function movePaddle(center) {\n    paddle.x = clamp(center - paddle.width / 2, 0, width - paddle.width);\n  }\n\n  function dockBall() {\n    ball.x = paddle.x + paddle.width / 2;\n    ball.y = paddle.y - ball.radius - 1;\n  }\n\n  function draw() {\n    context.clearRect(0, 0, width, height);\n    context.fillStyle = \"#293b47\";\n    context.beginPath();\n    context.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 3);\n    context.fill();\n    context.fillStyle = \"#376772\";\n    context.beginPath();\n    context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);\n    context.fill();\n  }\n\n  function nearestPoint(target) {\n    if (!target.wire) {\n      return {\n        x: clamp(ball.x, target.x, target.x + target.width),\n        y: clamp(ball.y, target.y, target.y + target.height),\n      };\n    }\n    const { from, to } = target;\n    const dx = to.x - from.x;\n    const dy = to.y - from.y;\n    const t = clamp(((ball.x - from.x) * dx + (ball.y - from.y) * dy) / (dx * dx + dy * dy), 0, 1);\n    return { x: from.x + t * dx, y: from.y + t * dy };\n  }\n\n  function advance(dt) {\n    const oldY = ball.y;\n    ball.x += ball.vx * dt;\n    ball.y += ball.vy * dt;\n\n    if (ball.x \u003c ball.radius || ball.x > width - ball.radius) {\n      ball.x = clamp(ball.x, ball.radius, width - ball.radius);\n      ball.vx *= -1;\n    }\n    if (ball.y \u003c ball.radius) {\n      ball.y = ball.radius;\n      ball.vy = Math.abs(ball.vy);\n    }\n\n    const atPaddle = oldY + ball.radius \u003c= paddle.y && ball.y + ball.radius >= paddle.y;\n    if (ball.vy > 0 && atPaddle && ball.x + ball.radius >= paddle.x &&\n        ball.x - ball.radius \u003c= paddle.x + paddle.width) {\n      const offset = clamp((ball.x - paddle.x) / paddle.width * 2 - 1, -1, 1);\n      const angle = offset * 0.98;\n      ball.y = paddle.y - ball.radius;\n      ball.vx = Math.sin(angle) * ballSpeed;\n      ball.vy = -Math.cos(angle) * ballSpeed;\n    }\n\n    for (const target of targets) {\n      if (target.health === 0) continue;\n      const point = nearestPoint(target);\n      const dx = ball.x - point.x;\n      const dy = ball.y - point.y;\n      const distance = Math.hypot(dx, dy);\n      if (distance === 0 || distance > ball.radius) continue;\n      const nx = dx / distance;\n      const ny = dy / distance;\n      const approach = ball.vx * nx + ball.vy * ny;\n      if (approach >= 0) continue;\n\n      // Separate the ball from this surface before the next physics step.\n      ball.x = point.x + nx * (ball.radius + 0.05);\n      ball.y = point.y + ny * (ball.radius + 0.05);\n      ball.vx -= 2 * approach * nx;\n      ball.vy -= 2 * approach * ny;\n      target.health--;\n      damaged.add(target);\n      return true;\n    }\n    return false;\n  }\n\n  function waitForServe() {\n    playing = false;\n    game.dataset.phase = \"ready\";\n    status.textContent = game.dataset.ready;\n    dockBall();\n  }\n\n  function serve() {\n    dockBall();\n    const aim = targets.filter((target) => !target.wire && target.health > 0 &&\n      target.y \u003c ball.y && Math.abs(target.x + target.width / 2 - ball.x) \u003c 32)\n      .sort((a, b) => b.y - a.y)[0];\n    const angle = aim\n      ? Math.atan2(aim.x + aim.width / 2 - ball.x, ball.y - aim.y)\n      : (ball.x > width / 2 ? -0.32 : 0.32);\n    ball.vx = Math.sin(angle) * ballSpeed;\n    ball.vy = -Math.cos(angle) * ballSpeed;\n    startedAt ??= performance.now();\n    playing = true;\n    game.dataset.phase = \"playing\";\n    status.textContent = game.dataset.playing;\n  }\n\n  function tick(now) {\n    const dt = Math.min((now - lastFrame) / 1000, 0.032);\n    lastFrame = now;\n    const direction = Number(pressed.has(\"ArrowRight\")) - Number(pressed.has(\"ArrowLeft\"));\n    if (direction) movePaddle(paddle.x + paddle.width / 2 + direction * 470 * dt);\n\n    if (playing) {\n      let hit = false;\n      const steps = Math.max(1, Math.ceil(dt * 240));\n      for (let i = 0; i \u003c steps; i++) {\n        if (advance(dt / steps)) hit = true;\n      }\n      if (hit) paintDamage();\n      if (hit && targets.every((target) => target.health === 0)) {\n        playing = false;\n        game.dataset.phase = \"complete\";\n        status.textContent = game.dataset.won;\n      } else if (ball.y - ball.radius > height) {\n        waitForServe();\n      }\n    } else {\n      dockBall();\n    }\n    draw();\n\n    if (startedAt !== undefined) {\n      const centiseconds = Math.floor(Math.max(0, now - startedAt) / 10);\n      const fields = [Math.floor(centiseconds / 6000), Math.floor(centiseconds / 100) % 60, centiseconds % 100];\n      clock.textContent = fields.map((field) => String(field).padStart(2, \"0\")).join(\":\");\n    }\n\n    if (game.dataset.phase !== \"complete\") frameId = requestAnimationFrame(tick);\n  }\n\n  function openGame() {\n    cancelAnimationFrame(frameId);\n    restoreNameplate();\n    pressed.clear();\n    pointer = undefined;\n    document.body.classList.add(\"game-active\");\n    document.dispatchEvent(new Event(\"inlinegamechange\"));\n    game.hidden = false;\n\n    const view = canvas.getBoundingClientRect();\n    width = view.width;\n    height = view.height;\n    const ratio = Math.min(window.devicePixelRatio || 1, 2);\n    canvas.width = Math.round(width * ratio);\n    canvas.height = Math.round(height * ratio);\n    context.setTransform(ratio, 0, 0, ratio, 0, 0);\n\n    origin = nameplate.getBoundingClientRect();\n    targets = [...wireTargets(), ...textTargets()];\n    const footerButton = launch.getBoundingClientRect();\n    paddle.y = clamp(footerButton.top + footerButton.height / 2 + 3, height - 72, height - 28);\n    movePaddle(width / 2);\n    waitForServe();\n    clock.textContent = \"00:00:00\";\n    canvas.focus({ preventScroll: true });\n    startedAt = undefined;\n    lastFrame = performance.now();\n    draw();\n    frameId = requestAnimationFrame(tick);\n  }\n\n  function stop(returnFocus = false) {\n    if (game.hidden) return;\n    cancelAnimationFrame(frameId);\n    playing = false;\n    pressed.clear();\n    pointer = undefined;\n    game.hidden = true;\n    restoreNameplate();\n    document.body.classList.remove(\"game-active\");\n    document.dispatchEvent(new Event(\"inlinegamechange\"));\n    if (returnFocus) launch.focus({ preventScroll: true });\n  }\n\n  function startGesture(event) {\n    if (event.button !== 0 || !event.isPrimary || pointer || game.dataset.phase === \"complete\") return;\n    pointer = {\n      id: event.pointerId,\n      x: event.clientX,\n      y: event.clientY,\n      ready: game.dataset.phase === \"ready\",\n      dragged: false,\n    };\n    canvas.setPointerCapture(event.pointerId);\n  }\n\n  function moveGesture(event) {\n    if (pointer?.id !== event.pointerId) {\n      if (playing && event.pointerType === \"mouse\" && !pointer) movePaddle(event.clientX);\n      return;\n    }\n    if (Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y) > 6) pointer.dragged = true;\n    if (pointer.dragged) movePaddle(event.clientX);\n  }\n\n  launch.addEventListener(\"pointerdown\", (event) => {\n    if (event.button !== 0 || !event.isPrimary || !game.hidden) return;\n    openGame();\n    startGesture(event);\n  });\n  launch.addEventListener(\"click\", (event) => {\n    // Keyboard and assistive activation do not generate pointer events.\n    if (event.detail === 0 && game.hidden) {\n      openGame();\n      serve();\n    }\n  });\n  exit.addEventListener(\"click\", () => stop(true));\n  canvas.addEventListener(\"pointermove\", moveGesture);\n  canvas.addEventListener(\"pointerdown\", startGesture);\n  canvas.addEventListener(\"pointerup\", (event) => {\n    if (pointer?.id !== event.pointerId) return;\n    moveGesture(event);\n    if (pointer.ready && !pointer.dragged && game.dataset.phase === \"ready\") serve();\n    pointer = undefined;\n  });\n  function clearGesture(event) {\n    if (pointer?.id === event.pointerId) pointer = undefined;\n  }\n  canvas.addEventListener(\"pointercancel\", clearGesture);\n  canvas.addEventListener(\"lostpointercapture\", clearGesture);\n  document.addEventListener(\"keydown\", (event) => {\n    if (game.hidden) return;\n    if (event.key === \"Escape\") {\n      event.preventDefault();\n      stop(true);\n    } else if (game.dataset.phase !== \"complete\" && (event.key === \"ArrowLeft\" || event.key === \"ArrowRight\")) {\n      event.preventDefault();\n      pressed.add(event.key);\n    } else if (event.target === canvas && game.dataset.phase === \"ready\" &&\n               (event.key === \" \" || event.key === \"Enter\")) {\n      event.preventDefault();\n      if (!event.repeat) serve();\n    }\n  });\n  document.addEventListener(\"keyup\", (event) => pressed.delete(event.key));\n  window.addEventListener(\"blur\", () => pressed.clear());\n  window.addEventListener(\"resize\", () => stop());\n  window.addEventListener(\"scroll\", () => stop(), { passive: true });\n\n  launch.hidden = false;\n})();\n\u003c/script>\n\u003cscript>\ndocument.addEventListener(\"click\", (event) => {\n  const link = event.target.closest(\"a[data-preview-route]\");\n  if (!link) return;\n  event.preventDefault();\n  parent.postMessage({ type: \"lei-wang-preview-route\", route: link.dataset.previewRoute }, \"*\");\n});\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n\n","zh-about":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"认识王磊，了解他的 AI Agent、检索增强生成与全栈应用开发方向。\">\n  \u003cmeta property=\"og:type\" content=\"website\">\n  \u003cmeta property=\"og:title\" content=\"关于 · 王磊\">\n  \u003cmeta property=\"og:description\" content=\"认识王磊，了解他的 AI Agent、检索增强生成与全栈应用开发方向。\">\n  \u003ctitle>关于 · 王磊\u003c/title>\n  \u003cbase href=\"about:srcdoc\">\n  \u003cstyle>\n:root {\n  color-scheme: light;\n  --paper: #fcfbf8;\n  --ink: #293b47;\n  --body: #575f64;\n  --muted: #677176;\n  --accent: #376772;\n  --line: #e1e3dd;\n  --wire: #c5cfca;\n  --mono: ui-monospace, SFMono-Regular, Consolas, monospace;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  display: flex;\n  flex-direction: column;\n  min-height: 100vh;\n  min-height: 100svh;\n  margin: 0;\n  color: var(--ink);\n  background: var(--paper);\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n}\n\na { color: inherit
